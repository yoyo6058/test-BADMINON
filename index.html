<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏸 一起來打羽球</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#e6f8ff,#f7fbff,#edfff6);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#25313a}
.app{max-width:480px;margin:auto;min-height:100vh}
header{background:linear-gradient(135deg,#22b8f2,#6575ee);color:#fff;padding:26px 20px 22px;border-radius:0 0 28px 28px}
.brand{font-size:28px;font-weight:900}.sub{margin-top:5px;font-size:13px}
nav{display:flex;gap:8px;padding:14px 16px}
nav button{flex:1;border:0;border-radius:13px;padding:12px;background:#fff;color:#507080;font-weight:800}
nav button.on{color:#1676a5;box-shadow:0 3px 12px #0001}
main{padding:0 16px 40px}
.card{background:#fffffff5;border-radius:20px;padding:19px;margin-bottom:14px;box-shadow:0 5px 20px #0000000b}
h2{font-size:20px;margin:0 0 15px}
label{display:block;font-size:13px;color:#68757d;margin:12px 0 6px}
input,textarea{width:100%;border:1px solid #d8e1e6;border-radius:11px;padding:12px;font-size:16px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.action{width:100%;border:0;border-radius:14px;padding:14px;margin-top:14px;font-size:16px;font-weight:900;cursor:pointer}
.green{background:linear-gradient(135deg,#16bf7b,#13aaa8);color:#fff}
.blue{background:#edf8ff;color:#2876a4}
.yellow{background:#fff1b8;color:#816100}
.hidden{display:none!important}
.event{cursor:pointer}
.date,.detailTitle,.detailTime{font-size:20px;color:#1676a5;font-weight:900;letter-spacing:.5px}.title{font-size:20px;font-weight:900;margin:6px 0 12px}.detailTitle{margin:10px 0 8px;color:#25313a}.detailTime{margin:0 0 14px}.note{margin-top:16px;padding:0;color:#a45a00;font-size:14px;font-weight:400;line-height:1.7;white-space:pre-wrap}.adminRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.adminBtn{border:0;border-radius:12px;padding:13px 10px;background:#f0f4ff;color:#4963a6;font-size:16px;font-weight:900;cursor:pointer}.join,.cancel,.share{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-size:18px;font-weight:900;cursor:pointer}.join{background:linear-gradient(135deg,#16bf7b,#13aaa8);color:#fff}.cancel{background:#edf8ff;color:#2876a4}.share{background:#f4f0ff;color:#6a50a5}.muted{color:#68757d;font-size:16px;margin-top:7px}.miniBtn{border:0;border-radius:9px;padding:6px 9px;margin-left:5px;background:#eef6ff;color:#2876a4;font-size:14px;cursor:pointer}.dangerMini{color:#b44;background:#fff0f0}.lockBadge{font-size:12px;color:#66727a;background:#f3f6f8;border-radius:999px;padding:5px 9px;margin-left:6px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info div{background:#f0fbf7;padding:11px;border-radius:10px;font-size:16px}
.count{margin-top:16px;font-size:18px}.count b{font-size:32px}.names{font-size:18px;line-height:2.1;padding-left:30px}.names li{padding-left:4px}
.empty{text-align:center;color:#999;padding:25px}
.person{padding:10px 0;border-bottom:1px solid #edf0f2}
.back{color:#2876a4;background:#edf8ff}

/* 手機閱讀字體加大：日期／時間維持原大小 */
.sub{font-size:17px}
nav button{font-size:17px;padding:14px 12px}
h2{font-size:22px}
h3{font-size:21px}
label{font-size:16px}
input,textarea{font-size:18px}
button.action{font-size:18px}
.title{font-size:22px}
.muted{font-size:18px}
.note{font-size:17px}
.adminBtn{font-size:18px;padding:14px 10px}
.lockBadge{font-size:14px}
.info div{font-size:18px;padding:12px}
.count{font-size:20px}
.names{font-size:20px;line-height:2.15}
.miniBtn{font-size:16px;padding:8px 10px}
.empty{font-size:18px}
.person{font-size:18px}


/* 場次資訊分區：場次／日期／時間一區；地點／場地數一區 */
.eventSummary{
  background:#eef8ff;
  border-radius:16px;
  padding:16px 18px;
  margin-top:12px;
}
.summaryTitle{
  font-size:22px;
  font-weight:900;
  color:#25313a;
  margin-bottom:8px;
}
.summaryDate{
  font-size:20px;
  font-weight:900;
  color:#1676a5;
  margin-bottom:4px;
}
.summaryTime{
  font-size:20px;
  font-weight:900;
  color:#1676a5;
}
.venueSummary{
  background:#effaf5;
  border-radius:16px;
  padding:15px 18px;
  margin-top:10px;
  color:#4f6068;
  font-size:18px;
  font-weight:800;
}
.summaryDivider{color:#9aa6ac;margin:0 6px}


/* 最終視覺調整 */
.backBtn{
  background:#effaf5 !important;
}
.eventSummary{
  background:#eef8ff;
  border-radius:16px;
  padding:16px 18px;
  margin-top:12px;
}
.summaryTitle{
  font-size:22px;
  font-weight:900;
  color:#2477a0;
  margin-bottom:8px;
}
.summaryDate{
  font-size:24px;
  font-weight:900;
  color:#1676a5;
  margin-bottom:5px;
}
.summaryTime{
  font-size:26px;
  font-weight:900;
  color:#1676a5;
}
.venueSummary{
  background:#effaf5;
  border-radius:16px;
  padding:15px 18px;
  margin-top:10px;
  color:#4f6068;
  font-size:18px;
  font-weight:800;
}
.noteBlock{
  background:#eef8ff;
  border-radius:16px;
  padding:14px 18px;
  margin-top:10px;
}
.note{
  background:transparent !important;
  margin:0 !important;
  padding:0 !important;
  color:#a86520;
  font-size:17px;
  font-weight:400 !important;
  line-height:1.7;
}
.adminBlock{
  background:#fff8e8;
  border-radius:18px;
  padding:16px;
  margin-top:14px;
}
.adminBlock .adminBtn{
  font-size:18px;
}


/* 最終顏色調整 */
.backBtn{
  background:#fff8e8 !important;
}
.summaryTitle{
  color:#d98282 !important;
}
.adminBlock{
  background:#fff8e8 !important;
}


/* 使用者指定的最終配色 */
.backToList{
  background:#fff8e8 !important;
  color:#8b6a24 !important;
}
.summaryTitle{
  color:#d98282 !important;
}
.adminBlock{
  background:#fff8e8 !important;
  border-radius:18px;
  padding:16px;
  margin-top:14px;
}
.adminHead{
  font-size:19px;
  font-weight:900;
  color:#5f5a4a;
  margin-bottom:8px;
}


/* 最終微調：團主管理區縮小、日期時間不粗體 */
.summaryDate{
  font-size:24px !important;
  font-weight:400 !important;
}
.summaryTime{
  font-size:26px !important;
  font-weight:400 !important;
}
.adminBlock{
  padding:10px 12px !important;
  margin-top:10px !important;
  border-radius:14px !important;
}
.adminHead{
  font-size:17px !important;
  margin-bottom:6px !important;
}
.adminBlock .adminRow{
  gap:6px !important;
}
.adminBlock .adminBtn{
  font-size:16px !important;
  padding:9px 8px !important;
}
.adminBlock > .adminBtn{
  margin-top:6px !important;
  padding:9px 8px !important;
}

</style>
</head>
<body>
<div class="app">
<header><div class="brand">🏸 一起來打羽球</div><div class="sub">煩惱 Out，羽球 In！</div></header>
<nav>
<button id="newBtn" class="on">＋ 建立場次</button>
<button id="listBtn">📋 我的場次</button>
</nav>

<main>
<section id="create">
<div class="card">
<h2>✨ 建立新場次</h2>
<label>日期</label>
<input id="date" type="date">

<div class="grid">
<div><label>開始時間</label><input id="start" type="time" value="19:00" step="60"></div>
<div><label>結束時間</label><input id="end" type="time" value="21:00" step="60"></div>
</div>

<label>場次名稱</label>
<input id="title" placeholder="例如：週三固定羽球">

<label>球館</label>
<input id="venue" placeholder="例如：暖西羽球館">

<div class="grid">
<div><label>場地數</label><input id="courts" type="number" min="1" value="3"></div>
<div><label>人數上限</label><input id="limit" type="number" min="1" value="20"></div>
</div>

<label>備註（選填）</label>
<textarea id="note" rows="3" placeholder="例如：請自備球拍"></textarea>

<button id="createBtn" class="action green">建立場次</button>
</div>
</section>

<section id="list" class="hidden">
<div id="events"></div>
</section>

<section id="detail" class="hidden">
<div class="card">
<div id="detailDate" class="date"></div>
<div id="detailTitle" class="title"></div>
<div class="info"><div id="detailVenue"></div><div id="detailCourts"></div></div>
<div id="detailCount" class="count"></div>
<div id="detailNote"></div>
<button id="joinBtn" class="action green">＋1 我要報名</button>
<button id="cancelBtn" class="action blue">取消報名</button>
</div>
<div class="card">
<h2>👥 報名名單</h2>
<div id="people" class="empty">目前還沒有人報名</div>
</div>
<button id="backBtn" class="action back">← 回我的場次</button>
</section>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://jrzzdeaovzmgdshfkrrv.supabase.co";
const SUPABASE_KEY="sb_publishable_Mkn3j1zIKAbGtlPfHefzBw_LT021nJO";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let currentEvent=null;
let realtimeChannel=null;
let refreshTimer=null;
let lastLiveSnapshot="";

function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmtDate(s){const d=new Date(s+"T00:00:00");return `${d.getMonth()+1}/${d.getDate()}（${"日一二三四五六"[d.getDay()]}）`}
function nameSaved(){return localStorage.getItem("badminton_name")||""}
function myRegKey(eventId){return `badminton_reg_${eventId}`}
function myRegId(eventId){return localStorage.getItem(myRegKey(eventId))||""}
function setMyRegId(eventId,id){localStorage.setItem(myRegKey(eventId),id)}
function clearMyRegId(eventId){localStorage.removeItem(myRegKey(eventId))}
const ADMIN_PASSWORD="2418";
function isAdmin(){return sessionStorage.getItem("badminton_admin")==="1"}
function requireAdmin(){
  if(isAdmin()) return true;
  const p=prompt("團主管理功能\n請輸入管理密碼：");
  if(p===ADMIN_PASSWORD){sessionStorage.setItem("badminton_admin","1");return true}
  if(p!==null) toast("密碼錯誤，無法使用團主管理功能");
  return false;
}
function toast(msg){alert(msg)}

function setupRealtime(){
  if(realtimeChannel){ db.removeChannel(realtimeChannel); realtimeChannel=null; }
  realtimeChannel=db.channel("badminton-live")
    .on("postgres_changes", {event:"*", schema:"public", table:"events"}, async (payload)=>{
      if(currentEvent && payload.eventType==="DELETE" && payload.old?.id===currentEvent.id){
        currentEvent=null;
        showTab("list");
        return;
      }
      if(currentEvent && payload.new?.id===currentEvent.id){
        const {data:e}=await db.from("events").select("*").eq("id",currentEvent.id).maybeSingle();
        if(e){ currentEvent=e; renderDetail(); }
      }
      if(!$('list').classList.contains('hidden')) loadEvents();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"registrations"}, async (payload)=>{
      const eventId=payload.new?.event_id || payload.old?.event_id;
      if(currentEvent && eventId===currentEvent.id) renderDetail();
      if(!$('list').classList.contains('hidden')) loadEvents();
    })
    .subscribe((status)=>{
      console.log("Realtime:",status);
    });
}

async function getLiveSnapshot(){
  if(currentEvent){
    const {data:e}=await db.from("events").select("*").eq("id",currentEvent.id).maybeSingle();
    if(!e) return "__DELETED__";
    const {data:r}=await db.from("registrations").select("*").eq("event_id",currentEvent.id).order("registered_at",{ascending:true});
    return JSON.stringify({e,r});
  }
  if(!$('list').classList.contains('hidden')){
    const {data:e}=await db.from("events").select("*").order("event_date",{ascending:true}).order("start_time",{ascending:true});
    return JSON.stringify(e||[]);
  }
  return "";
}

function startAutoRefresh(){
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer=setInterval(async ()=>{
    try{
      const snap=await getLiveSnapshot();
      if(!snap) return;
      if(snap==="__DELETED__"){
        currentEvent=null;
        lastLiveSnapshot="";
        showTab("list");
        return;
      }
      if(snap===lastLiveSnapshot) return; // 沒有變化就不重繪，避免畫面一直閃動
      lastLiveSnapshot=snap;
      if(currentEvent){
        const parsed=JSON.parse(snap);
        currentEvent=parsed.e;
        await renderDetail();
      }else if(!$('list').classList.contains('hidden')){
        await loadEvents();
      }
    }catch(e){ console.warn("auto refresh",e); }
  },3000);
}

function showTab(which){
  $("create").classList.toggle("hidden",which!=="create");
  $("list").classList.toggle("hidden",which!=="list");
  $("detail").classList.add("hidden");
  $("newBtn").classList.toggle("on",which==="create");
  $("listBtn").classList.toggle("on",which==="list");
  if(which==="list") loadEvents();
}

async function loadEvents(){
  $("list").classList.remove("hidden");
  $("create").classList.add("hidden");
  $("detail").classList.add("hidden");
  $("list").innerHTML='<div class="card empty">載入場次中…</div>';
  const {data,error}=await db.from("events").select("*").order("event_date",{ascending:true}).order("start_time",{ascending:true});
  if(error){$("list").innerHTML='<div class="card empty">讀取失敗：請確認 Supabase 資料表設定。</div>';return}
  if(!data.length){$("list").innerHTML='<div class="card empty">目前還沒有場次</div>';return}
  const cards=[];
  for(const e of data){
    const {data:r}=await db.from("registrations").select("id,status").eq("event_id",e.id);
    const confirmed=(r||[]).filter(x=>x.status==="confirmed").length;
    cards.push(`<div class="event">
      <div class="date">${fmtDate(e.event_date)}　${String(e.start_time).slice(0,5)}–${String(e.end_time).slice(0,5)}</div>
      <div class="title">${esc(e.title)}</div>
      <div class="muted">${esc(e.venue||"未填場地")}　｜　${e.courts} 面場</div>
      <div class="muted">目前 ${confirmed} / ${e.participant_limit} 人</div>${e.notes?`<div class="noteBlock"><div class="note">📝 ${esc(e.notes)}</div></div>`:""}
      <button onclick="openEvent('${e.id}')">查看／報名</button>
    </div>`);
  }
  $("list").innerHTML=cards.join("");
}

async function createEvent(){
  const date=$("date").value,start=$("start").value,end=$("end").value,title=$("title").value.trim();
  if(!date||!start||!end||!title){toast("請填日期、時間和場次名稱");return}
  if(start>=end){toast("結束時間要晚於開始時間");return}
  const payload={
    title,event_date:date,start_time:start,end_time:end,
    venue:$("venue").value.trim(),courts:Number($("courts").value)||1,
    participant_limit:Number($("limit").value)||20,notes:$("note").value.trim()
  };
  $("createBtn").disabled=true;
  const {data,error}=await db.from("events").insert(payload).select().single();
  $("createBtn").disabled=false;
  if(error){toast("建立失敗："+error.message);return}
  openEvent(data.id);
}

async function openEvent(id){
  const {data:e,error}=await db.from("events").select("*").eq("id",id).single();
  if(error){toast("找不到場次");return}
  currentEvent=e;
  $("create").classList.add("hidden");
  $("list").classList.add("hidden");
  $("detail").classList.remove("hidden");
  renderDetail();
}

async function renderDetail(){
  const e=currentEvent;
  const {data:regs,error}=await db.from("registrations").select("*").eq("event_id",e.id).order("registered_at",{ascending:true});
  if(error){toast("讀取名單失敗");return}
  const confirmed=(regs||[]).filter(r=>r.status==="confirmed");
  const wait=(regs||[]).filter(r=>r.status==="waitlist");
  const me=nameSaved();
  const mineId=myRegId(e.id);
  const my=(regs||[]).find(r=>r.id===mineId) || ((regs||[]).find(r=>r.name===me) || null);

  const actionButtons = my ? `
    <button class="detailAction friendAction" onclick="joinForOther()">👥 幫朋友報名</button>
    <button class="detailAction cancelAction" onclick="cancelReg('${my.id}')">✕ 取消報名</button>
    <button class="detailAction listAction" onclick="toggleRoster()">☷ 已報名名單</button>` : `
    <button class="detailAction friendAction" onclick="joinForOther()">👥 幫朋友報名</button>
    <button class="detailAction cancelAction disabledAction" disabled>✕ 取消報名</button>
    <button class="detailAction listAction" onclick="toggleRoster()">☷ 已報名名單</button>`;

  const rosterRows = confirmed.map((r,i)=>{
    const own = r.id===mineId;
    const admin = isRegAdmin();
    const actions = admin
      ? `<span class="personActions"><button class="miniBtn" onclick="editReg('${r.id}')">✏️</button><button class="miniBtn dangerMini" onclick="adminDeleteReg('${r.id}')">🗑️</button></span>`
      : own
        ? `<span class="personActions"><button class="miniBtn" onclick="editMyReg('${r.id}')">✏️</button><button class="miniBtn dangerMini" onclick="cancelReg('${r.id}')">🗑️</button></span>`
        : "";
    return `<div class="personRow"><span class="personNo">${i+1}.</span><span class="personName">${esc(r.name)}</span>${actions}</div>`;
  }).join("");

  const roster = confirmed.length ? `<div class="rosterGrid ${confirmed.length>15?'threeCols':'twoCols'}">${rosterRows}</div>` : `<div class="empty">目前還沒有人報名</div>`;
  const waitHtml = wait.length ? `<div class="waitlist"><div class="waitTitle">候補 ${wait.length} 人</div>${wait.map((r,i)=>`<div>${i+1}. ${esc(r.name)}${isRegAdmin()?` <button class="miniBtn" onclick="editReg('${r.id}')">✏️</button><button class="miniBtn dangerMini" onclick="adminDeleteReg('${r.id}')">🗑️</button>`:""}</div>`).join("")}</div>` : "";

  $("detail").innerHTML=`
    <div class="card detailCard">
      <button class="backToList" onclick="showTab('list')">← 回到場次</button>
      <div class="eventSummary">
        <div class="summaryTitle">${esc(e.title)}</div>
        <div class="summaryDate">${fmtDate(e.event_date)}</div>
        <div class="summaryTime">${String(e.start_time).slice(0,5)}–${String(e.end_time).slice(0,5)}</div>
        <div class="venueSummary">${esc(e.venue||"未填場地")} <span class="summaryDivider">｜</span> ${e.courts} 面場地</div>
        ${e.notes?`<div class="noteBlock"><div class="note">📝 ${esc(e.notes)}</div></div>`:""}
      </div>
      <div class="attendance"><div class="attendanceCount"><span class="bigCount">${confirmed.length}</span><span class="smallCount">/ ${e.participant_limit} 人</span></div><div class="myStatus">${my ? (my.status==="confirmed"?"你已報名":"你在候補名單") : "你未報名"}</div></div>
      <button class="join fullJoin" onclick="join()">＋1 報名</button>
      <div class="detailActions">${actionButtons}</div>
      <div class="rosterCard" id="rosterCard">
        <div class="rosterHead"><span>👥 已報名名單</span><span class="rosterCount">(${confirmed.length} 人)</span><button class="rosterToggle" onclick="toggleRoster()">⌃</button></div>
        <div id="rosterBody">${roster}${waitHtml}</div>
      </div>
      <div class="adminBlock">
        <div class="adminHead">🔒 團主管理</div>
        <div class="adminRow">
          <button class="adminBtn editEventBtn" onclick="if(requireAdmin())showEditForm()">✏️ 編輯場次</button>
          <button class="adminBtn deleteEventBtn" onclick="if(requireAdmin())deleteEvent()">🗑️ 刪除場次</button>
          <button class="adminBtn manageRegBtn" onclick="if(requireRegAdmin())renderDetail()">✏️ 修改／刪除報名</button>
        </div>
        ${isRegAdmin()?`<div class="adminHint">已開啟報名管理：可修改或刪除任何人的報名</div>`:""}
      </div>
      <div id="editArea" class="hidden"></div>
    </div>`;
}

function toggleRoster(){
  const body=$("rosterBody");
  if(!body)return;
  body.classList.toggle("hidden");
  const btn=document.querySelector(".rosterToggle");
  if(btn)btn.textContent=body.classList.contains("hidden")?"⌄":"⌃";
}

function showEditForm(){
  const e=currentEvent;
  $("editArea").classList.remove("hidden");
  $("editArea").innerHTML=`
    <h2>✏️ 編輯場次</h2>
    <label>日期</label><input id="editDate" type="date" value="${e.event_date}">
    <div class="grid">
      <div><label>開始時間</label><input id="editStart" type="time" value="${String(e.start_time).slice(0,5)}"></div>
      <div><label>結束時間</label><input id="editEnd" type="time" value="${String(e.end_time).slice(0,5)}"></div>
    </div>
    <label>場次名稱</label><input id="editTitle" value="${esc(e.title)}">
    <label>球館</label><input id="editVenue" value="${esc(e.venue||"")}">
    <div class="grid">
      <div><label>場地數</label><input id="editCourts" type="number" min="1" value="${e.courts||1}"></div>
      <div><label>人數上限</label><input id="editLimit" type="number" min="1" value="${e.participant_limit||20}"></div>
    </div>
    <label>備註（選填）</label><textarea id="editNote" rows="3">${esc(e.notes||"")}</textarea>
    <button class="action green" onclick="saveEdit()">💾 儲存修改</button>
    <button class="action blue" onclick="$('editArea').classList.add('hidden')">取消編輯</button>`;
}

async function saveEdit(){
  if(!requireAdmin())return;
  const date=$("editDate").value,start=$("editStart").value,end=$("editEnd").value,title=$("editTitle").value.trim();
  if(!date||!start||!end||!title){toast("請填日期、時間和場次名稱");return}
  if(start>=end){toast("結束時間要晚於開始時間");return}
  const payload={
    title,event_date:date,start_time:start,end_time:end,
    venue:$("editVenue").value.trim(),courts:Number($("editCourts").value)||1,
    participant_limit:Number($("editLimit").value)||20,notes:$("editNote").value.trim()
  };
  const {data,error}=await db.from("events").update(payload).eq("id",currentEvent.id).select().single();
  if(error){toast("修改失敗："+error.message);return}
  currentEvent=data;
  toast("場次已修改");
  renderDetail();
}

async function joinForOther(){
  if(!requireAdmin())return;
  let name=prompt("請輸入要幫忙報名的球友姓名");
  if(!name||!name.trim())return;
  name=name.trim();
  const {data:old}=await db.from("registrations").select("*").eq("event_id",currentEvent.id).eq("name",name).maybeSingle();
  if(old){toast(`${name} 已經報名過了`);return}
  const {data:all}=await db.from("registrations").select("status").eq("event_id",currentEvent.id);
  const confirmed=(all||[]).filter(r=>r.status==="confirmed").length;
  const status=confirmed<currentEvent.participant_limit?"confirmed":"waitlist";
  const {error}=await db.from("registrations").insert({event_id:currentEvent.id,name,status});
  if(error){toast("代報名失敗："+error.message);return}
  toast(status==="confirmed"?`${name} 報名成功！`:`已額滿，${name} 已加入候補`);
  renderDetail();
}

async function deleteEvent(){
  if(!requireAdmin())return;
  const ok=confirm(`確定要刪除「${currentEvent.title}」這個場次嗎？\n\n刪除後，這個場次及所有報名資料都會一起刪除，無法復原。`);
  if(!ok)return;
  const {error}=await db.from("events").delete().eq("id",currentEvent.id);
  if(error){toast("刪除失敗："+error.message);return}
  toast("場次已刪除");
  currentEvent=null;
  showTab("list");
  loadEvents();
}

async function join(){
  let name=nameSaved();
  if(!name) name=prompt("第一次報名，請輸入你的姓名");
  if(!name||!name.trim())return;
  name=name.trim();
  localStorage.setItem("badminton_name",name);

  const {data:old}=await db.from("registrations").select("*").eq("event_id",currentEvent.id).eq("name",name).maybeSingle();
  if(old){toast("你已經報名過了");return}

  const {data:all}=await db.from("registrations").select("status").eq("event_id",currentEvent.id);
  const confirmed=(all||[]).filter(r=>r.status==="confirmed").length;
  const status=confirmed<currentEvent.participant_limit?"confirmed":"waitlist";

  const {data:newReg,error}=await db.from("registrations").insert({event_id:currentEvent.id,name,status}).select("id").single();
  if(error){toast("報名失敗："+error.message);return}
  setMyRegId(currentEvent.id,newReg.id);
  toast(status==="confirmed"?"報名成功！":"已額滿，已加入候補");
  renderDetail();
}

async function editMyReg(id){
  const mineId=myRegId(currentEvent.id);
  if(id!==mineId){toast("只能修改自己的報名");return}
  await editReg(id,false);
}

async function editReg(id,admin=true){
  if(admin && !requireAdmin())return;
  const {data:reg,error}=await db.from("registrations").select("*").eq("id",id).single();
  if(error||!reg){toast("找不到這筆報名");return}
  let name=prompt("請輸入新的姓名：",reg.name);
  if(name===null)return;
  name=name.trim();
  if(!name){toast("姓名不能空白");return}
  if(name===reg.name)return;
  const {data:dup}=await db.from("registrations").select("id").eq("event_id",currentEvent.id).eq("name",name).neq("id",id).maybeSingle();
  if(dup){toast(`${name} 已經報名過了`);return}
  const {error:upErr}=await db.from("registrations").update({name}).eq("id",id);
  if(upErr){toast("修改失敗："+upErr.message);return}
  if(id===myRegId(currentEvent.id)) localStorage.setItem("badminton_name",name);
  toast("姓名已修改");
  renderDetail();
}

async function adminDeleteReg(id){
  if(!requireAdmin())return;
  if(!confirm("確定要刪除這筆報名嗎？"))return;
  await cancelReg(id,true);
}

async function cancelReg(id,fromAdmin=false){
  if(!fromAdmin && id!==myRegId(currentEvent.id)){toast("只能取消自己的報名");return}
  if(!fromAdmin && !confirm("確定要取消報名嗎？"))return;
  const {error}=await db.from("registrations").delete().eq("id",id);
  if(error){toast("取消失敗："+error.message);return}
  if(id===myRegId(currentEvent.id)) clearMyRegId(currentEvent.id);

  // 取消正取後，依報名順序把第一位候補遞補成正取。
  const {data:wait}=await db.from("registrations").select("*").eq("event_id",currentEvent.id).eq("status","waitlist").order("registered_at",{ascending:true}).limit(1);
  if(wait&&wait[0]) await db.from("registrations").update({status:"confirmed"}).eq("id",wait[0].id);

  toast("已取消報名");
  renderDetail();
}

async function copyLink(){
  const url=location.href.split("#")[0]+"#event="+currentEvent.id;
  try{await navigator.clipboard.writeText(url);toast("連結已複製，可以貼到 LINE 群");}
  catch(e){prompt("請複製連結：",url)}
}

$("newBtn").onclick=()=>{if(requireAdmin())showTab("create")};
$("listBtn").onclick=()=>showTab("list");
$("createBtn").onclick=()=>{if(requireAdmin())createEvent()};

function init(){
  $("date").value=new Date().toISOString().slice(0,10);
  const id=location.hash.startsWith("#event=")?location.hash.slice(7):"";
  if(id) openEvent(id); else showTab("list");
}
init();
setupRealtime();
startAutoRefresh();
</script>
</body>
