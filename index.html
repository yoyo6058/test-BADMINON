/* V12：兩個「再想想」按鈕使用指定邊框色 */

.modal-title{color:#5F6468!important;font-weight:700!important}

/* Status marker style: retain original colors without capsule backgrounds. */
.event-count .event-status, .admin-ended-badge, .admin-view-ended-badge, .badge-confirmed, .record .rstatus {
  position:relative;
  display:inline-block;
  background:transparent !important;
  border-radius:0 !important;
  z-index:0;
  isolation:isolate;
}
.event-count .event-status::before, .admin-ended-badge::before, .admin-view-ended-badge::before, .badge-confirmed::before, .record .rstatus::before {
  content:"";
  position:absolute;
  z-index:-1;
  left:4%;
  right:4%;
  top:50%;
  height:52%;
  transform:translateY(-50%) rotate(-7deg);
  clip-path:polygon(4% 30%, 19% 12%, 37% 22%, 55% 7%, 72% 18%, 95% 28%, 91% 72%, 74% 84%, 57% 75%, 39% 91%, 20% 80%, 3% 68%);
}
.event-count .event-status.ongoing::before { background:#E8F1ED; left:0; right:0; }
.admin-ongoing-badge::before { background:#E8F1ED; }

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');if(id!=='signup')stopSignupKeyboardPoll();if($('signup'))$('signup').classList.remove('keyboard-open');if($('records'))$('records').classList.remove('records-keyboard-open');document.body.classList.remove('keyboard-visible');if(id!=='detail'){adminEditMode=false;adminViewMode=false;}if($('detail')){$('detail').classList.toggle('editing',id==='detail'&&adminEditMode);$('detail').classList.toggle('admin-viewing',id==='detail'&&adminViewMode);}const activeNav=adminViewMode?'admin':id;document.querySelectorAll('.bottom-nav .nav-item').forEach(b=>b.classList.toggle('nav-active',b.dataset.nav===activeNav));if($('globalNav'))$('globalNav').style.display=['list'].includes(id)?'flex':'none';if(id==='list')loadEvents();if(id==='records')loadRecords();if(id==='admin')renderAdmin();if(id==='detail'&&currentEvent&&!adminEditMode&&!adminViewMode)renderDetail();window.scrollTo(0,0)}
function fmtDate(d){const x=new Date(d+'T00:00:00');return {m:String(x.getMonth()+1).padStart(2,'0'),d:String(x.getDate()).padStart(2,'0'),w:['日','一','二','三','四','五','六'][x.getDay()]}}

async function loadEvents(){const {data,error}=await db.from('events').select('*').order('created_at',{ascending:false});if(error){toast('場次讀取失敗');return}events=data||[];if(events.length>4){const oldIds=events.slice(4).map(e=>e.id);const {error:deleteOldError}=await db.from('events').delete().in('id',oldIds);if(deleteOldError){console.error('cleanup old events:',deleteOldError);toast('舊場次清理失敗');return}events=events.slice(0,4)}const html=await Promise.all(events.map(async e=>{const {count}=await db.from('registrations').select('*',{count:'exact',head:true}).eq('event_id',e.id).eq('status','confirmed');const d=fmtDate(e.event_date);const ended=isEnded(e);return `<article class="event-card${ended?' ended':''}"><div class="event-top"><div class="date"><b>${d.m}/${d.d}</b><span>週${d.w}</span></div><div class="event-main"><div class="event-title">${iconRacket()}${esc(e.title)}</div><div class="event-time">${iconTime()}${time(e.start_time)}－${time(e.end_time)}</div></div></div><div class="small event-count"><div class="event-count-line"><strong class="count-number">${count||0}</strong><span> / ${e.participant_limit||21} 人</span></div>${ended?'<span class="event-status ended">已結束</span>':'<span class="event-status ongoing">報名中</span>'}</div>${ended?'':`<div class="event-actions"><button class="btn btn-list" onclick="openRosterForEvent('${e.id}')">報名名單</button><button class="btn btn-view" onclick="openDetail('${e.id}')">查看/報名</button></div>`}</article>`}));$('eventList').innerHTML=html.join('')||'<div class="empty">目前還沒有場次<br>建立第一場羽球活動吧！</div>'}
function openDetail(id){currentEvent=events.find(e=>e.id===id);if(!currentEvent)return;if(blockEndedForUser(currentEvent))return;renderDetail();show('detail')}
async function openRosterForEvent(id){currentEvent=events.find(e=>e.id===id)||null;if(!currentEvent)return;if(blockEndedForUser(currentEvent))return;await showRoster()}
async function renderDetail(){const e=currentEvent;$('detailHeading').style.display='flex';$('detailHeading').querySelector('.section-title').textContent='活動報名';$('detailCountOutside').style.display='flex';const {data}=await db.from('registrations').select('*').eq('event_id',e.id).order('registered_at',{ascending:true});regs=data||[];const d=fmtDate(e.event_date);const confirmedCount=regs.filter(r=>r.status==='confirmed').length;$('detailCountOutside').innerHTML=`<strong class="count-number">${confirmedCount}</strong><span> / ${e.participant_limit||21} 人</span>`;$('detailCard').innerHTML=`<div class="info-card signup-info-card"><div class="info-grid"><div class="info-date"><b>${d.m}/${d.d}</b><span>週${d.w}</span></div><div class="info-title">${iconRacket()}${esc(e.title)}</div><div class="info-line info-time-line">${iconTime()}${time(e.start_time)}－${time(e.end_time)}</div><div class="info-line info-venue-line"><span class="info-line-spacer" aria-hidden="true"></span><span>${esc(e.venue||'未填球館')} ・ ${e.courts||3} 面</span></div></div><div class="detail-action-row"><button class="btn btn-pink" onclick="cancelMyRegistration()">取消報名</button><button class="btn btn-green" onclick="openSignup('${e.id}')">＋1 報名</button></div></div>${e.notes?`<div class="signup-note">${esc(e.notes)}</div>`:''}`}
async function openSignup(id){currentEvent=events.find(e=>e.id===id)||currentEvent;if(!currentEvent)return;if(blockEndedForUser(currentEvent))return;$('signupCard').innerHTML=`<div class="info-card signup-info-card"><div class="info-grid"><div class="info-date"><b>${fmtDate(currentEvent.event_date).m}/${fmtDate(currentEvent.event_date).d}</b><span>週${fmtDate(currentEvent.event_date).w}</span></div><div class="info-title">${iconRacket()}${esc(currentEvent.title)}</div><div class="info-line info-time-line">${iconTime()}${time(currentEvent.start_time)}－${time(currentEvent.end_time)}</div><div class="info-line info-venue-line"><span class="info-line-spacer" aria-hidden="true"></span><span>${esc(currentEvent.venue||'未填球館')} ・ ${currentEvent.courts||3} 面</span></div></div></div><div class="form-card"><div class="field"><input id="signupName" value="" placeholder="請輸入姓名"></div></div>${currentEvent.notes?`<div class="signup-note">${esc(currentEvent.notes)}</div>`:''}`;$('signup').dataset.mode='any';signupViewportBase=signupViewportHeight();formControlFocused=false;show('signup');setKeyboardOpen(false);startSignupKeyboardPoll()}
async function confirmSignup(){const name=$('signupName').value.trim();if(!name)return toast('請先輸入姓名');await registerName(name,'any')}
async function registerName(name,mode){const {data:existing,error:checkError}=await db.from('registrations').select('id,status,name').eq('event_id',currentEvent.id).eq('name',name).limit(1);if(checkError)return toast('報名檢查失敗，請稍後再試');if(existing&&existing.length){toast('你已經報名了！');return}const {count}=await db.from('registrations').select('*',{count:'exact',head:true}).eq('event_id',currentEvent.id).eq('status','confirmed');const status=(count||0)>=(currentEvent.participant_limit||21)?'waitlist':'confirmed';const {data,error}=await db.from('registrations').insert({event_id:currentEvent.id,name,status}).select().single();if(error){if(error.code==='23505'||/duplicate|unique/i.test(error.message||''))return toast('你已經報名了！');return toast('報名失敗，請稍後再試')}setMine(currentEvent.id,data.id);currentReg=data;showSuccess(data,status==='waitlist')}
function showSuccess(r,wait){const d=fmtDate(currentEvent.event_date);$('successDetail').innerHTML=`<div><span class="success-date">${iconRacket()}${d.m}/${d.d}</span>　${esc(currentEvent.title)}</div><div><span class="success-name">${esc(r.name)}</span> ${wait?'（候補中）':'已加入報名名單'}</div>`;show('success')}
async function showRoster(){if(!currentEvent)return;const {data,error}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).order('registered_at',{ascending:true});if(error)return toast('名單讀取失敗');regs=data||[];const confirmed=regs.filter(r=>r.status==='confirmed'),wait=regs.filter(r=>r.status==='waitlist');$('rosterCard').innerHTML=`<div class="roster-card"><div class="roster-date-line">${iconCalendar()}${fmtDate(currentEvent.event_date).m}/${fmtDate(currentEvent.event_date).d}<span class="roster-weekday">（週${fmtDate(currentEvent.event_date).w}）</span></div><div class="roster-event-line"><span class="roster-event-title">${iconRacket()}${esc(currentEvent.title)}</span><span>${iconTime()}${time(currentEvent.start_time)}－${time(currentEvent.end_time)}</span></div><div class="count"><strong class="count-number">${confirmed.length}</strong> / ${currentEvent.participant_limit||21} 人</div>${confirmed.map((r,i)=>personRow(r,i+1,'已報名')).join('')}${wait.length?`<div class="small" style="margin-top:14px">候補</div>${wait.map((r,i)=>personRow(r,i+1,'候補')).join('')}`:''}</div>`;show('roster')}
function personRow(r,num,status){return `<div class="person"><span class="person-name">${num}. ${esc(r.name)}</span><span class="person-actions"><button class="trash-btn" title="取消報名" aria-label="取消${esc(r.name)}的報名" onclick="cancelRegistration('${r.id}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V4h6v2M18.5 6l-1 14h-11l-1-14M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="badge ${status==='已報名'?'badge-confirmed':''}">${status}</span></span></div>`}
function askCancel(name){return new Promise(resolve=>{const modal=$('cancelModal'),title=$('cancelModalTitle'),yes=$('cancelConfirmBtn'),no=$('cancelBackBtn');title.textContent=`確定要取消「${name}」的報名嗎？`;modal.classList.add('show');document.body.classList.add('password-keyboard-open');modal.setAttribute('aria-hidden','false');const close=value=>{modal.classList.remove('show');document.body.classList.remove('password-keyboard-open');modal.setAttribute('aria-hidden','true');yes.onclick=null;no.onclick=null;resolve(value)};yes.onclick=()=>close(true);no.onclick=()=>close(false)} )}
async function cancelRegistration(id){const r=regs.find(x=>x.id===id);if(!r)return;if(!(await askCancel(r.name)))return;const {error}=await db.from('registrations').delete().eq('id',id).eq('event_id',currentEvent.id);if(error)return toast('取消失敗：'+(error.message||'請稍後再試'));if(localStorage.getItem('badminton_reg_'+currentEvent.id)===id)localStorage.removeItem('badminton_reg_'+currentEvent.id);if(r.status==='confirmed'){const {data:wait}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).eq('status','waitlist').order('registered_at',{ascending:true}).limit(1);if(wait&&wait[0])await db.from('registrations').update({status:'confirmed'}).eq('id',wait[0].id)}toast('已取消報名');await showRoster()}
function getMine(id){const name=localStorage.getItem('badminton_name')||'';return regs.find(r=>r.event_id===id&&r.name===name)||null}function setMine(id,rid){localStorage.setItem('badminton_reg_'+id,rid)}
async function cancelMyRegistration(){if(!currentEvent)return;await showRoster()}
function requirePassword(action){return new Promise(resolve=>{const modal=$('passwordModal'),title=$('passwordModalTitle'),input=$('passwordInput'),yes=$('passwordConfirmBtn'),no=$('passwordCancelBtn');title.textContent=action+'請輸入密碼';input.value='';modal.classList.add('show');document.body.classList.add('password-keyboard-open');modal.setAttribute('aria-hidden','false');const close=value=>{modal.classList.remove('show');document.body.classList.remove('password-keyboard-open');modal.setAttribute('aria-hidden','true');yes.onclick=null;no.onclick=null;input.onkeydown=null;resolve(value)};yes.onclick=()=>{const p=input.value;if(p!=='2418'){toast('密碼錯誤');input.value='';input.focus();return}close(true)};no.onclick=()=>close(false);input.onkeydown=e=>{if(e.key==='Enter')yes.click()};setTimeout(()=>{input.focus();input.select()},60)})}
document.addEventListener('input',e=>{if(e.target.id==='passwordInput')e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)});
let formControlFocused=false;
let keyboardSyncTimer=null;
let signupViewportBase=null;
let signupKeyboardPoll=null;
function setKeyboardOpen(open){const signup=$('signup');if(signup)signup.classList.toggle('keyboard-open',!!open)}
function signupViewportHeight(){
 const vv=window.visualViewport?.height||0;
 const wh=window.innerHeight||0;
 return Math.max(vv,wh);
}
function updateSignupKeyboardState(){
 const signup=$('signup');
 if(!signup||!signup.classList.contains('active'))return;
 const h=signupViewportHeight();
 if(signupViewportBase==null)signupViewportBase=h;
 const active=document.activeElement;
 const focused=!!(active&&active.matches&&active.matches('input,textarea,select'));
 if(formControlFocused && signupViewportBase-h>40){
   setKeyboardOpen(true);
   return;
 }
 // When the keyboard is dismissed, some mobile browsers keep focus on the input
 // and do not fire blur/focusout. Use the restored viewport height as the signal.
 if(signupViewportBase-h<=40){
   setKeyboardOpen(false);
   return;
 }
 setKeyboardOpen(focused&&formControlFocused);
}
function scheduleSignupKeyboardSync(delay=0){clearTimeout(keyboardSyncTimer);keyboardSyncTimer=setTimeout(updateSignupKeyboardState,delay)}
function startSignupKeyboardPoll(){
 clearInterval(signupKeyboardPoll);
 signupKeyboardPoll=setInterval(()=>{
   const signup=$('signup');
   if(!signup||!signup.classList.contains('active'))return;
   updateSignupKeyboardState();
 },100);
}
function stopSignupKeyboardPoll(){clearInterval(signupKeyboardPoll);signupKeyboardPoll=null}
document.addEventListener('focusin',e=>{
 if(e.target.id==='recordsName'&&$('records')?.classList.contains('active')){
   $('records').classList.add('records-keyboard-open');document.body.classList.add('keyboard-visible');
 }
 if(e.target.matches('input,textarea,select')&&$('signup')?.classList.contains('active')){
   formControlFocused=true;
   setKeyboardOpen(true);
   document.body.classList.add('keyboard-visible');
   scheduleSignupKeyboardSync(100);
 }
});
document.addEventListener('focusout',e=>{
 if(e.target.id==='recordsName'&&$('records')?.classList.contains('active')){
   $('records').classList.remove('records-keyboard-open');document.body.classList.remove('keyboard-visible');
 }
 if(e.target.matches('input,textarea,select')&&$('signup')?.classList.contains('active')){
   formControlFocused=false;
   setKeyboardOpen(false);
   document.body.classList.remove('keyboard-visible');
   scheduleSignupKeyboardSync(0);
 }
});
if(window.visualViewport){
 window.visualViewport.addEventListener('resize',()=>{
   if(!$('signup')?.classList.contains('active'))return;
   scheduleSignupKeyboardSync(0);
 });
 window.visualViewport.addEventListener('scroll',updateSignupKeyboardState);
}
window.addEventListener('resize',()=>{if($('signup')?.classList.contains('active'))scheduleSignupKeyboardSync(0)});

async function renderAdmin(){await loadEvents();const list=$('adminList');if(!list)return;list.innerHTML=events.map(e=>{const ended=isEnded(e);return `<div class="admin-item${ended?' ended':''}"><div class="admin-item-meta"><span class="admin-date-line">${iconCalendar()}${fmtDate(e.event_date).m}/${fmtDate(e.event_date).d}</span>　<span class="admin-time-line">${iconTime()}${time(e.start_time)}－${time(e.end_time)}</span></div><div class="admin-item-title-row"><div class="admin-item-title">${iconRacket()}${esc(e.title)}</div>${ended?'<span class="admin-ended-badge">已結束</span>':'<span class="admin-ended-badge admin-ongoing-badge">報名中</span>'}</div><div class="admin-item-actions"><button class="btn btn-pink" onclick="adminDelete('${e.id}')">刪除</button>${ended?`<button class="btn btn-view-ended" onclick="adminView('${e.id}')">查看</button>`:`<button class="btn btn-green" onclick="adminEdit('${e.id}')">編輯</button>`}</div></div>`}).join('')||'<div class="empty">目前沒有場次</div>'}
async function adminView(id){currentEvent=events.find(e=>e.id===id);if(!currentEvent)return;if(!isEnded(currentEvent))return adminEdit(id);adminViewMode=true;adminEditMode=false;show('detail');await renderAdminView()}
async function renderAdminView(){if(!currentEvent)return;const e=currentEvent;const {data,error}=await db.from('registrations').select('*').eq('event_id',e.id).order('registered_at',{ascending:true});if(error)return toast('名單讀取失敗');regs=data||[];const confirmed=regs.filter(r=>r.status==='confirmed'),wait=regs.filter(r=>r.status==='waitlist');const d=fmtDate(e.event_date);$('detailHeading').style.display='flex';$('detailHeading').querySelector('.section-title').textContent='查看活動';$('detailCountOutside').style.display='flex';$('detailCountOutside').innerHTML=`<strong class="count-number">${confirmed.length}</strong><span> / ${e.participant_limit||21} 人</span>`;$('detailCard').innerHTML=`<div class="info-card signup-info-card admin-view-card"><span class="admin-view-ended-badge">已結束</span><div class="info-grid"><div class="info-date"><b>${d.m}/${d.d}</b><span>週${d.w}</span></div><div class="info-title admin-view-title">${iconRacket()}<span class="admin-view-title-text">${esc(e.title)}</span></div><div class="info-line info-time-line">${iconTime()}${time(e.start_time)}－${time(e.end_time)}</div><div class="info-line info-venue-line"><span class="info-line-spacer" aria-hidden="true"></span><span>${esc(e.venue||'未填球館')} ・ ${e.courts||3} 面</span></div></div></div><div class="roster-card" style="margin-top:14px"><div class="section-title" style="margin:0 0 10px">報名名單</div>${confirmed.map((r,i)=>`<div class="person"><span class="person-name">${i+1}. ${esc(r.name)}</span><span class="person-actions"><span class="badge badge-confirmed">已報名</span></span></div>`).join('')}${wait.length?`<div class="small" style="margin-top:14px">候補</div>${wait.map((r,i)=>`<div class="person"><span class="person-name">${i+1}. ${esc(r.name)}</span><span class="person-actions"><span class="badge">候補</span></span></div>`).join('')}`:''}</div>`} 
async function adminEdit(id){currentEvent=events.find(e=>e.id===id);if(!currentEvent)return;adminEditMode=true;show('detail');editEvent()}
async function adminDelete(id){currentEvent=events.find(e=>e.id===id);if(!currentEvent)return;if(!(await askDeleteEvent(currentEvent.title)))return;const {error}=await db.from('events').delete().eq('id',currentEvent.id);if(error)return toast('刪除失敗');currentEvent=null;await renderAdmin();await loadEvents()}
async function openCreate(){if(await requirePassword('建立場次：'))show('create')}
async function submitCreateEvent(){
 const btn=$('createSubmit');
 if(btn.dataset.busy==='1')return;
 const title=$('fTitle').value.trim();
 const date=$('fDate').value;
 const start=$('fStart').value;
 const end=$('fEnd').value;
 if(!title||!date||!start||!end){toast('請填寫活動名稱、日期與時間');return}
 if(end<=start){toast('結束時間要晚於開始時間');return}
 const payload={title,event_date:date,start_time:start,end_time:end,venue:$('fVenue').value.trim(),courts:Math.max(1,Number($('fCourts').value)||3),participant_limit:Math.max(1,Number($('fLimit').value)||21),notes:$('fNotes').value.trim(),created_at:new Date().toISOString()};
 btn.dataset.busy='1';btn.setAttribute('aria-busy','true');btn.querySelector('span:last-child').textContent='建立中…';
 try{
   const {error}=await db.from('events').insert(payload);
   if(error){console.error('submitCreateEvent:',error);toast('建立失敗，請稍後再試');return}
   await loadEvents();
   $('fTitle').value='';$('fDate').value='';$('fStart').value='';$('fEnd').value='';$('fVenue').value='';$('fCourts').value='3';$('fLimit').value='21';$('fNotes').value='';
   toast('場次已建立');
   show('list');
 }catch(err){
   console.error('submitCreateEvent exception:',err);
   toast('建立失敗，請稍後再試');
 }finally{
   btn.dataset.busy='0';btn.removeAttribute('aria-busy');btn.querySelector('span:last-child').textContent='建立場次';
 }
}
function askDeleteEvent(name){return new Promise(resolve=>{const modal=$('deleteModal'),title=$('deleteModalTitle'),yes=$('deleteConfirmBtn'),no=$('deleteBackBtn');title.textContent=`確定要刪除「${name}」這個場次嗎？`;modal.classList.add('show');document.body.classList.add('password-keyboard-open');modal.setAttribute('aria-hidden','false');const close=value=>{modal.classList.remove('show');document.body.classList.remove('password-keyboard-open');modal.setAttribute('aria-hidden','true');yes.onclick=null;no.onclick=null;resolve(value)};yes.onclick=()=>close(true);no.onclick=()=>close(false)})}
async function deleteEvent(){if(!currentEvent)return;if(!(await askDeleteEvent(currentEvent.title)))return;const {error}=await db.from('events').delete().eq('id',currentEvent.id);if(error)return toast('刪除失敗');currentEvent=null;show('list')}
async function editEvent(){if(!currentEvent)return;const e=currentEvent;$('detail').classList.add('editing');$('detailHeading').style.display='none';$('detailCountOutside').style.display='none';const card=$('detailCard');card.innerHTML=`<div class="form-card"><div class="field"><label>活動名稱</label><input id="eTitle" value="${esc(e.title)}"></div><div class="two"><div class="field"><label>日期</label><input id="eDate" type="date" value="${e.event_date}"></div><div class="field"><label>開始</label><input id="eStart" type="time" value="${time(e.start_time)}"></div></div><div class="field"><label>結束</label><input id="eEnd" type="time" value="${time(e.end_time)}"></div><div class="field"><label>球館</label><input id="eVenue" value="${esc(e.venue||'')}"></div><div class="two"><div class="field"><label>場地數</label><input id="eCourts" type="number" value="${e.courts||3}"></div><div class="field"><label>人數上限</label><input id="eLimit" type="number" value="${e.participant_limit||21}"></div></div><div class="field"><label>備註</label><textarea id="eNotes" rows="3">${esc(e.notes||'')}</textarea></div></div>`}
async function saveEvent(){if(!currentEvent||!$('eTitle'))return;const {data,error}=await db.from('events').update({title:$('eTitle').value.trim(),event_date:$('eDate').value,start_time:$('eStart').value,end_time:$('eEnd').value,venue:$('eVenue').value.trim(),courts:+$('eCourts').value||3,participant_limit:+$('eLimit').value||21,notes:$('eNotes').value.trim()}).eq('id',currentEvent.id).select().single();if(error)return toast('修改失敗');currentEvent=data;adminEditMode=false;$('detail').classList.remove('editing');$('detailHeading').style.display='';$('detailCountOutside').style.display='';toast('已儲存');await renderDetail()}
async function loadRecords(){const input=$('recordsName');const name=input?input.value.trim():'';if(!name){$('recordsList').innerHTML='<div class="empty record-empty">請先輸入姓名</div>';return}const {data,error}=await db.from('registrations').select('*,events(*)').eq('name',name).order('registered_at',{ascending:false});if(error){$('recordsList').innerHTML='<div class="empty record-empty">紀錄讀取失敗，請稍後再試</div>';return}const rows=data||[];$('recordsList').innerHTML=rows.map(r=>`<div class="record"><div class="rdate">${r.events?.event_date||''}</div><div class="rtitle">${esc(r.events?.title||'')}</div><div class="rstatus">${r.status==='waitlist'?'候補':'已報名'}</div></div>`).join('')||`<div class="empty record-empty">找不到「${esc(name)}」的報名紀錄<br>請確認姓名是否輸入正確</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
loadEvents();setInterval(()=>{if(document.querySelector('#list.active'))loadEvents()},5000);
</script></body></html>
