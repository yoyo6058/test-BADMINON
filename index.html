.records-head{font-size:24px;font-weight:900;color:#173d78;margin:3px 2px 11px}.record-tabs{display:grid;grid-template-columns:1fr 1fr;background:#edf7fb;border-radius:13px;padding:3px;margin-bottom:10px}.record-tab{border:0;background:transparent;padding:9px;color:#667985;font-size:14px;font-weight:900;border-radius:10px}.record-tab.on{background:#fff;color:#3b8e6a;box-shadow:0 2px 7px rgba(45,98,124,.07)}.record-list{background:#fff;border-radius:16px;padding:3px 10px;box-shadow:0 3px 12px rgba(47,93,116,.06)}.record-item{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid #e6eef3}.record-item:last-child{border-bottom:0}.record-date{background:transparent!important;border-radius:0;text-align:left;padding:0;color:#397d9d;font-weight:900}.record-date b{display:block;font-size:18px}.record-date span{font-size:12px}.record-title{font-size:16px;font-weight:900;color:#173d78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record-info{font-size:14px;color:#536b7b;line-height:1.45;margin-top:3px}.record-status{padding:4px 7px;border-radius:8px;font-size:11px;font-weight:900;background:#e2f5ea;color:#398762}.record-status.wait{background:#fff2c9;color:#b27a16}.records-empty{text-align:center;padding:35px 10px;color:#8b9aa4}

.bottom-nav{position:fixed;z-index:40;left:50%;bottom:0;transform:translateX(-50%);width:min(390px,100vw);height:70px;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-top:1px solid #dcecf4;box-shadow:0 -3px 12px rgba(55,91,112,.08)}.bottom-nav .bn{width:100%;border:0;background:#fff;color:#8a9aa5;font-size:13px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.bottom-nav .bn.on{color:#3d8bad;background:#f2faff}.bn-icon{font-size:19px;line-height:1}

.back-row{padding:0 2px}.roster-page .back-row,.success-card~*{display:none}.roster-page{padding:0}.roster-page #rosterPageCard{margin-top:0}
.modal{position:fixed;inset:0;background:rgba(23,61,120,.34);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.modalbox{width:min(350px,calc(100vw - 40px));background:#fff;border-radius:17px;padding:17px;box-shadow:0 15px 50px rgba(0,0,0,.2)}.modal-title{font-size:20px;font-weight:900;margin-bottom:9px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.modal-actions button{border:0;border-radius:10px;padding:10px;font-size:15px;font-weight:900}.cancelmodal{background:#eef0f2;color:#58636c}.okmodal{background:#dff2fb;color:#317da5}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#26343c;color:#fff;padding:9px 14px;border-radius:99px;z-index:120;font-size:14px;max-width:90vw}.home-admin{display:none}
@media(min-width:391px){.app{width:390px}.bottom-nav,.nav{width:390px}}
@media(max-width:360px){.hero-copy{left:83px}.play-text{font-size:20px}.logo-title{font-size:34px}.logo-title b{font-size:40px}.event-card{grid-template-columns:58px minmax(0,1fr) 76px}.datebox{width:58px;height:88px}.date{font-size:19px}.weekday{font-size:14px}.event-card .view{width:76px;font-size:12px}.detail-basic{grid-template-columns:63px minmax(0,1fr)}.detail-datebox{width:63px}.detail-title{font-size:21px}.detail-time{font-size:17px}.action{font-size:12px}.record-item{grid-template-columns:56px minmax(0,1fr) auto}.record-title{font-size:15px}.record-info{font-size:13px}}
</style>

<body>
<div class="app">
<header class="header">
  <div id="backTop" class="backTop">‹</div>
  <svg class="racketSvg" viewBox="0 0 70 110" aria-hidden="true"><ellipse cx="34" cy="30" rx="24" ry="28" fill="none" stroke="#1f6ca4" stroke-width="5"/><path d="M16 12L52 47M10 28L56 30M19 47L48 12M34 3L34 56" stroke="#d9f4ff" stroke-width="2"/><path d="M34 57L51 101" stroke="#1d4775" stroke-width="7" stroke-linecap="round"/><path d="M47 97L55 106" stroke="#f1c56b" stroke-width="6" stroke-linecap="round"/></svg><svg class="shuttleSvg" viewBox="0 0 48 52" aria-hidden="true"><path d="M8 8L24 29L40 8M13 12L20 34M24 29L24 4M35 12L28 34" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M14 33Q24 43 34 33L30 46Q24 51 18 46Z" fill="#fff"/><ellipse cx="24" cy="44" rx="8" ry="4" fill="#7fb5d4"/></svg>
  <div class="hamb">☰</div>
  <div class="hero-copy">
    <div class="play-text">Let's Play</div>
    <div class="logo-title"><span>羽球</span><b>＋1</b></div>
    <div class="sub">揪團打球・運動更快樂</div>
  </div>
  <div class="detail-brand">一起來打羽球</div>
</header>
<div class="nav">
  <button id="newBtn" class="create-top">＋ 建立場次</button>
</div>
<main class="content">
<section id="create" class="hidden"><div class="create-card"><div class="section-title">建立新場次</div><button class="back create-back" onclick="showTab('list')">‹ 返回首頁</button><label>日期</label><input id="date" type="date"><div class="grid"><div><label>開始時間</label><input id="start" type="time" value="19:00"></div><div><label>結束時間</label><input id="end" type="time" value="21:00"></div></div><label>場次名稱</label><input id="title" placeholder="例如：週三羽球"><label>球館</label><input id="venue" placeholder="例如：基隆運動中心"><div class="grid"><div><label>場地數</label><input id="courts" type="number" min="1" value="3"></div><div><label>人數上限</label><input id="limit" type="number" min="1" value="21"></div></div><label>備註</label><textarea id="note" rows="3"></textarea><button id="createBtn" class="primary">建立場次</button></div></section>
<section id="list"><div id="events" class="events"></div></section>
<section id="detail" class="hidden"><div id="detailCard"></div><div id="rosterCard" class="hidden"></div></section>
<section id="rosterScreen" class="hidden"><div class="roster-page"><div id="rosterPageCard"></div></div></section>
<section id="signupScreen" class="hidden"><div class="back-row"><button id="signupBack" class="back">‹ 返回場次</button></div><div id="signupCard"></div></section>
<section id="successScreen" class="hidden"><div id="successCard"></div></section>
<section id="recordsScreen" class="hidden"><div id="recordsCard"></div></section>
</main>
<nav id="bottomNav" class="bottom-nav"><button data-tab="list" class="bn on"><span class="bn-icon">▣</span><span>場次</span></button><button data-tab="recordsScreen" class="bn"><span class="bn-icon">♙</span><span>我的</span></button></nav></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div id="modalTitle" class="modal-title"></div><div id="modalBody"></div><div class="modal-actions"><button class="cancelmodal" id="modalCancel">取消</button><button class="okmodal" id="modalOK">確定</button></div></div></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://jrzzdeaovzmgdshfkrrv.supabase.co';const SUPABASE_KEY='sb_publishable_Mkn3j1zIKAbGtlPfHefzBw_LT021nJO';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let currentEvent=null,adminMode=localStorage.getItem('badminton_admin_unlocked')==='1',modalResolve=null,realtimeChannel=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function showModal(title,html){return new Promise(r=>{$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.remove('hidden');modalResolve=r})}
function closeModal(v){$('modal').classList.add('hidden');if(modalResolve){const r=modalResolve;modalResolve=null;r(v)}}
$('modalCancel').onclick=()=>closeModal(null);$('modalOK').onclick=()=>{const i=$('modalInput');closeModal(i?i.value:true)};
function askText(title,ph,val=''){return showModal(title,`<input id="modalInput" type="text" maxlength="30" placeholder="${esc(ph)}" value="${esc(val)}">`).then(v=>v===null?null:String(v).trim())}
async function requireAdmin(){if(adminMode||localStorage.getItem('badminton_admin_unlocked')==='1'){adminMode=true;return true}const v=await showModal('🔐 團主管理','<input id="modalInput" type="password" inputmode="numeric" maxlength="8" placeholder="請輸入團主密碼">');if(v==='2418'){adminMode=true;localStorage.setItem('badminton_admin_unlocked','1');return true}return false}
function fmtDate(d){let [y,m,day]=String(d).split('-');return `${m}/${day}`}function week(d){return ['日','一','二','三','四','五','六'][new Date(d+'T00:00:00').getDay()]}function fmtTime(t){return String(t||'').slice(0,5)}function myKey(id){return 'badminton_reg_'+id}function myId(id){return localStorage.getItem(myKey(id))||''}function setMy(id,r){localStorage.setItem(myKey(id),r)}function clearMy(id){localStorage.removeItem(myKey(id))}
function showTab(t){document.body.classList.toggle('subpage',t!=='list');['create','list','detail','rosterScreen','signupScreen','successScreen','recordsScreen'].forEach(id=>{const el=$(id);if(el)el.classList.toggle('hidden',id!==t)});$('newBtn').classList.toggle('hidden',t!=='list');$('bottomNav').classList.toggle('hidden',t==='create'||t==='signupScreen');document.querySelectorAll('.bn').forEach(b=>b.classList.toggle('on',b.dataset.tab===t||(t==='list'&&b.dataset.tab==='list')));if(t==='list')loadEvents();if(t==='rosterScreen')renderRosterPage();if(t==='signupScreen')renderSignupScreen();if(t==='recordsScreen')renderRecords()}
async function loadEvents(){const {data,error}=await db.from('events').select('*').order('created_at',{ascending:false});if(error){$('events').innerHTML='<div class="empty">讀取失敗，請稍後再試</div>';return}const rows=(data||[]).slice(0,4);if(!rows.length){$('events').innerHTML='<div class="empty">目前沒有場次</div>';return}let html='';for(let i=0;i<rows.length;i++){const e=rows[i];const {data:r}=await db.from('registrations').select('status').eq('event_id',e.id);const n=(r||[]).filter(x=>x.status==='confirmed').length;const p=['pastel1','pastel2','pastel3','pastel4'][i%4];html+=`<div class="event-card"><div class="datebox ${p}"><div class="date">${fmtDate(e.event_date)}</div><div class="weekday">(${week(e.event_date)})</div></div><div><div class="event-title">${esc(e.title)}</div><div class="event-line home-time">◷ ${fmtTime(e.start_time)} - ${fmtTime(e.end_time)}</div><div class="event-line home-count">👥 ${n} / ${e.participant_limit||21} 人</div></div><button class="view" onclick="openEvent('${e.id}')">查看／報名</button></div>`}$('events').innerHTML=html}

async function createEvent(){if(!(await requireAdmin())){toast('密碼錯誤');return}const date=$('date').value,start=$('start').value,end=$('end').value,title=$('title').value.trim();if(!date||!start||!end||!title){toast('請填完整資料');return}if(start>=end){toast('結束時間要晚於開始時間');return}const payload={title,event_date:date,start_time:start,end_time:end,venue:$('venue').value.trim(),courts:+$('courts').value||1,participant_limit:+$('limit').value||21,notes:$('note').value.trim()};const {error}=await db.from('events').insert(payload);if(error){toast('建立失敗：'+error.message);return}const {data:all}=await db.from('events').select('id,created_at').order('created_at',{ascending:false});for(const old of (all||[]).slice(4))await db.from('events').delete().eq('id',old.id);toast('場次建立成功');showTab('list')}
async function openEvent(id){const {data,error}=await db.from('events').select('*').eq('id',id).single();if(error||!data){toast('找不到場次');return}currentEvent=data;showTab('detail');await renderDetail();subscribeEvent(id)}
async function renderDetail(){if(!currentEvent)return;const {data,error}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).order('registered_at',{ascending:true});if(error){toast('讀取報名資料失敗');return}const regs=data||[],confirmed=regs.filter(r=>r.status==='confirmed'),wait=regs.filter(r=>r.status==='waitlist'),mine=myId(currentEvent.id),mineReg=regs.find(r=>r.id===mine),limit=currentEvent.participant_limit||21,pct=Math.min(100,Math.round(confirmed.length/limit*100));$('detailCard').innerHTML=`<div class="detail-card"><div class="detail-basic"><div class="detail-datebox"><b>${fmtDate(currentEvent.event_date)}</b><span>(${week(currentEvent.event_date)})</span></div><div class="detail-main"><div class="detail-title">${esc(currentEvent.title)}</div><div class="detail-time">◷ ${fmtTime(currentEvent.start_time)} - ${fmtTime(currentEvent.end_time)}</div><div class="detail-meta"><span>📍 ${esc(currentEvent.venue||'未提供球館')}</span><span>🏸 ${currentEvent.courts||1} 面場地</span></div></div></div><div class="attendance-new"><div class="attendance-line"><span>👥 報名人數</span><b>${confirmed.length} / ${limit} 人</b></div><div class="progress"><i style="width:${pct}%"></i></div><div class="attendance-foot"><span>${confirmed.length<limit?`還有 ${limit-confirmed.length} 個名額`: '目前已額滿'}</span><span>${mineReg?'你已報名':'你未報名'}</span></div></div>${currentEvent.notes?`<div class="detail-note-box"><b>備註</b><span>${esc(currentEvent.notes)}</span></div>`:''}<div class="detail-actions"><button class="join" onclick="showTab('signupScreen')">＋1 我要報名</button><div class="actions"><button class="action friend" onclick="joinForOther()">👥 幫朋友報名</button><button class="action cancel" onclick="cancelMine()">✕ 取消報名</button></div><button class="roster-link" onclick="showTab('rosterScreen')">👥 報名名單 <span>(${confirmed.length})</span><span class="arrow">›</span></button></div>${adminHtml()}</div>`;renderRoster(confirmed,wait,mine)}
function trashSvg(){return `<svg class="trash-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function adminHtml(){return `<div class="admin"><div class="admin-title">🔒 團主管理</div>${adminMode?`<div class="admin-grid"><button class="admin-btn" onclick="editEvent()">✎ 編輯場次</button><button class="admin-btn red" onclick="deleteEvent()">${trashSvg()} 刪除場次</button><button class="admin-btn coffee" onclick="toggleRoster(true)">👥 修改／刪除報名</button></div>`:`<button class="admin-open" onclick="enterAdmin()">🔐 開啟團主管理</button>`}</div>`}
function renderRoster(arr,wait,mine){const e=$('rosterCard'),wasOpen=e.dataset.open==='1';let cols=arr.length>=16?'cols3':'cols2',ordered=arr;if(cols==='cols3'){const rows=Math.ceil(arr.length/3),tmp=[];for(let r=0;r<rows;r++)for(let c=0;c<3;c++){const idx=r+c*rows;if(idx<arr.length)tmp.push(arr[idx])}ordered=tmp}e.innerHTML=`<div class="roster"><div class="roster-head">👥 已報名名單 <span style="font-size:16px;margin-left:5px">(${arr.length}人)</span><button class="chev" onclick="toggleRoster()">⌃</button></div><div class="roster-list ${cols}">${ordered.map(r=>`<div class="person"><span class="num">${arr.indexOf(r)+1}.</span><span class="pname">${esc(r.name)}</span><span class="person-actions">${r.id===mine&&!adminMode?`<button class="mini" onclick="editMyReg('${r.id}')">✎</button><button class="mini del" onclick="cancelReg('${r.id}')">${trashSvg()}</button>`:''}${adminMode?`<button class="mini" onclick="editReg('${r.id}')">✎</button><button class="mini del" onclick="adminDeleteReg('${r.id}')">${trashSvg()}</button>`:''}</span></div>`).join('')}</div>${wait.length?`<div class="wait"><b>候補 ${wait.length} 人</b><br>${wait.map((r,i)=>`${i+1}. ${esc(r.name)}${adminMode?`　<button class="mini" onclick="editReg('${r.id}')">✎</button><button class="mini del" onclick="adminDeleteReg('${r.id}')">${trashSvg()}</button>`:''}`).join('<br>')}</div>`:''}</div>`;e.dataset.open=wasOpen?'1':'0';e.classList.toggle('hidden',!wasOpen)}
function toggleRoster(force=false){const e=$('rosterCard');if(force){e.classList.remove('hidden');e.dataset.open='1';return}if(e.dataset.open==='1'){e.classList.add('hidden');e.dataset.open='0'}else{e.classList.remove('hidden');e.dataset.open='1'}}
async function join(){if(!currentEvent)return;let name=localStorage.getItem('badminton_name')||'';if(!name)name=await askText('第一次報名','請輸入你的姓名');if(!name)return;localStorage.setItem('badminton_name',name);const {data:old}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).eq('name',name).maybeSingle();if(old){setMy(currentEvent.id,old.id);toast('你已經報名過了');return}const {data:all}=await db.from('registrations').select('status').eq('event_id',currentEvent.id);const n=(all||[]).filter(x=>x.status==='confirmed').length;const status=n<(currentEvent.participant_limit||21)?'confirmed':'waitlist';const {data:r,error}=await db.from('registrations').insert({event_id:currentEvent.id,name,status}).select().single();if(error){toast('報名失敗：'+error.message);return}setMy(currentEvent.id,r.id);toast(status==='confirmed'?'報名成功！':'已額滿，加入候補');renderDetail()}
async function joinForOther(){if(!currentEvent)return;const name=await askText('幫朋友報名','請輸入朋友姓名');if(!name)return;const {data:old}=await db.from('registrations').select('id').eq('event_id',currentEvent.id).eq('name',name).maybeSingle();if(old){toast(`${name} 已經報名過了`);return}const {data:all}=await db.from('registrations').select('status').eq('event_id',currentEvent.id);const n=(all||[]).filter(x=>x.status==='confirmed').length;const status=n<(currentEvent.participant_limit||21)?'confirmed':'waitlist';const {error}=await db.from('registrations').insert({event_id:currentEvent.id,name,status});if(error){toast('代報名失敗：'+error.message);return}toast(status==='confirmed'?`${name} 報名成功！`:`已額滿，${name} 加入候補`);renderDetail()}
async function cancelMine(){const id=myId(currentEvent.id);if(!id){toast('你目前沒有報名');return}const ok=await showModal('取消報名','<div>確定要取消你的報名嗎？</div>');if(ok===null)return;cancelReg(id)}
async function cancelReg(id,admin=false){if(!admin&&id!==myId(currentEvent.id)){toast('只能取消自己的報名');return}const {data:r}=await db.from('registrations').select('*').eq('id',id).single();if(!r)return;const {error}=await db.from('registrations').delete().eq('id',id);if(error){toast('取消失敗');return}if(id===myId(currentEvent.id))clearMy(currentEvent.id);if(r.status==='confirmed'){const {data:w}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).eq('status','waitlist').order('registered_at',{ascending:true}).limit(1);if(w&&w[0])await db.from('registrations').update({status:'confirmed'}).eq('id',w[0].id)}toast('已取消報名');renderDetail()}
async function editMyReg(id){if(id!==myId(currentEvent.id)){toast('只能修改自己的報名');return}editReg(id,false)}async function editReg(id,admin=true){if(admin&&!adminMode){toast('請先開啟團主管理');return}const {data:r}=await db.from('registrations').select('*').eq('id',id).single();if(!r)return;const name=await askText('修改姓名','請輸入新的姓名',r.name);if(!name||name===r.name)return;const {data:dup}=await db.from('registrations').select('id').eq('event_id',currentEvent.id).eq('name',name).neq('id',id).maybeSingle();if(dup){toast(`${name} 已經報名過了`);return}const {error}=await db.from('registrations').update({name}).eq('id',id);if(error){toast('修改失敗');return}if(id===myId(currentEvent.id))localStorage.setItem('badminton_name',name);toast('姓名已修改');renderDetail()}
async function adminDeleteReg(id){if(!adminMode)return;const ok=await showModal('刪除報名','<div>確定要刪除這筆報名嗎？</div>');if(ok===null)return;cancelReg(id,true)}
async function editEvent(){if(!adminMode){toast('請先開啟團主管理');return}const html=`<div class="create-card"><label>日期</label><input id="ed" type="date" value="${currentEvent.event_date}"><div class="grid"><div><label>開始</label><input id="es" type="time" value="${fmtTime(currentEvent.start_time)}"></div><div><label>結束</label><input id="ee" type="time" value="${fmtTime(currentEvent.end_time)}"></div></div><label>場次名稱</label><input id="et" value="${esc(currentEvent.title)}"><label>球館</label><input id="ev" value="${esc(currentEvent.venue||'')}"><div class="grid"><div><label>場地數</label><input id="ec" type="number" value="${currentEvent.courts||1}"></div><div><label>人數上限</label><input id="el" type="number" value="${currentEvent.participant_limit||21}"></div></div><label>備註</label><textarea id="en" rows="3">${esc(currentEvent.notes||'')}</textarea><button class="primary" onclick="saveEventEdit()">儲存修改</button></div>`;$('detailCard').insertAdjacentHTML('beforeend',html)}
async function saveEventEdit(){const p={event_date:$('ed').value,start_time:$('es').value,end_time:$('ee').value,title:$('et').value.trim(),venue:$('ev').value.trim(),courts:+$('ec').value||1,participant_limit:+$('el').value||21,notes:$('en').value.trim()};const {data,error}=await db.from('events').update(p).eq('id',currentEvent.id).select().single();if(error){toast('修改失敗');return}currentEvent=data;toast('場次已修改');renderDetail()}
async function deleteEvent(){if(!adminMode){toast('請先開啟團主管理');return}const ok=await showModal('刪除場次','<div>確定刪除這個場次？<br>所有報名資料也會一起刪除。</div>');if(ok===null)return;const {error}=await db.from('events').delete().eq('id',currentEvent.id);if(error){toast('刪除失敗');return}currentEvent=null;toast('場次已刪除');showTab('list')}
async function enterAdmin(){if(await requireAdmin()){adminMode=true;localStorage.setItem('badminton_admin_unlocked','1');toast('團主模式已開啟');if(currentEvent)renderDetail();}}
function renderRosterPage(){if(!currentEvent)return;const wrap=$('rosterPageCard');wrap.innerHTML=`<div class="roster-page-card"><div class="roster-page-head"><button class="roster-tab on">已報名 <span id="rpConfirmed"></span></button><button class="roster-tab">候補 <span id="rpWait"></span></button></div><div id="rpList" class="roster-page-list"></div></div><button class="roster-back" onclick="currentEvent=null;showTab('list')">返回首頁</button>`;loadRosterPage()}
async function loadRosterPage(){if(!currentEvent)return;const {data,error}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).order('registered_at',{ascending:true});if(error){toast('讀取報名名單失敗');return}const rows=data||[],confirmed=rows.filter(r=>r.status==='confirmed'),wait=rows.filter(r=>r.status==='waitlist');$('rpConfirmed').textContent='('+confirmed.length+')';$('rpWait').textContent='('+wait.length+')';$('rpList').innerHTML=confirmed.map((r,i)=>'<div class="roster-row"><span class="roster-num">'+(i+1)+'</span><span class="roster-name">'+esc(r.name)+'</span><span class="roster-time">'+new Date(r.registered_at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false})+'</span></div>').join('')+(wait.length?'<div style="margin:12px 0 5px;font-weight:900;color:#b36b37">候補名單</div>'+wait.map((r,i)=>'<div class="roster-row roster-wait"><span class="roster-num">'+(i+1)+'</span><span class="roster-name">'+esc(r.name)+'</span><span class="roster-time">候補</span></div>').join(''):'')||'<div class="empty">目前還沒有人報名</div>'}
function renderSignupScreen(){if(!currentEvent)return;const mine=myId(currentEvent.id),name=localStorage.getItem('badminton_name')||'';$('signupCard').innerHTML='<div class="signup-card"><div class="detail-card" style="box-shadow:none;padding:8px 0"><div class="detail-title">'+esc(currentEvent.title)+'</div><div class="detail-date">'+fmtDate(currentEvent.event_date)+' ('+week(currentEvent.event_date)+')</div><div class="detail-time">'+fmtTime(currentEvent.start_time)+' - '+fmtTime(currentEvent.end_time)+'</div><div class="detail-venue">📍 '+esc(currentEvent.venue||'未提供球館')+'</div></div><label>姓名</label><input id="signupName" value="'+esc(name)+'" placeholder="請輸入姓名"><label style="display:flex;align-items:center;gap:8px;margin-top:13px;color:#24435f"><input id="rememberName" type="checkbox" checked style="width:20px;height:20px">記住我的姓名</label><button class="screen-btn" onclick="confirmSignup()">確認報名</button></div>'}
async function confirmSignup(){const name=($('signupName')?.value||'').trim();if(!name){toast('請輸入姓名');return}if($('rememberName')?.checked)localStorage.setItem('badminton_name',name);else localStorage.removeItem('badminton_name');await doJoin(name)}
async function doJoin(name){if(!currentEvent)return;const {data:old}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).eq('name',name).maybeSingle();if(old){setMy(currentEvent.id,old.id);toast('你已經報名過了');showTab('detail');return}const {data:all}=await db.from('registrations').select('status').eq('event_id',currentEvent.id);const n=(all||[]).filter(x=>x.status==='confirmed').length;const status=n<(currentEvent.participant_limit||21)?'confirmed':'waitlist';const {data:r,error}=await db.from('registrations').insert({event_id:currentEvent.id,name,status}).select().single();if(error){toast('報名失敗：'+error.message);return}setMy(currentEvent.id,r.id);showTab('successScreen');renderSuccess(status,name)}
function renderSuccess(status,name){$('successCard').innerHTML=`<div class="success-card"><div class="success-icon">✓</div><div class="success-title">${status==='confirmed'?'報名成功！':'已加入候補'}</div><div class="success-sub">${fmtDate(currentEvent.event_date)} ${esc(currentEvent.title)}<br>${esc(name)}<br>${status==='confirmed'?'':'目前已額滿，你已排入候補名單。'}</div><button class="screen-btn secondary" onclick="showTab('rosterScreen')">查看名單</button><button class="screen-btn" onclick="showTab('list')">返回首頁</button></div>`}
function renderRecords(){const wrap=$('recordsCard');wrap.innerHTML='<div class="records-head">我的紀錄</div><div class="record-tabs"><button class="record-tab on">即將參加</button><button class="record-tab">歷史紀錄</button></div><div id="recordList" class="record-list"><div class="records-empty">讀取中…</div></div>';loadRecords()}
async function loadRecords(){const {data:events,error}=await db.from('events').select('*').order('event_date',{ascending:true});if(error){$('recordList').innerHTML='<div class="records-empty">目前無法讀取</div>';return}const mine=[];for(const e of (events||[])){const id=myId(e.id);if(!id)continue;const {data:r}=await db.from('registrations').select('*').eq('id',id).maybeSingle();if(r)mine.push({e,r})}const now=new Date();const upcoming=mine.filter(x=>new Date(x.e.event_date+'T'+fmtTime(x.e.end_time))>=now).sort((a,b)=>a.e.event_date.localeCompare(b.e.event_date));const history=mine.filter(x=>!upcoming.includes(x)).sort((a,b)=>b.e.event_date.localeCompare(a.e.event_date));const list=[...upcoming,...history];if(!list.length){$('recordList').innerHTML='<div class="records-empty">目前還沒有報名紀錄</div>';return} $('recordList').innerHTML=list.map(({e,r})=>`<div class="record-item"><div class="record-date"><b>${fmtDate(e.event_date)}</b><span>週${week(e.event_date)}</span></div><div><div class="record-title">${esc(e.title)}</div><div class="record-info">◷ ${fmtTime(e.start_time)} - ${fmtTime(e.end_time)}</div></div><span class="record-status ${r.status==='waitlist'?'wait':''}">${r.status==='waitlist'?'候補中':'已報名'}</span></div>`).join('')}
function subscribeEvent(id){if(realtimeChannel)db.removeChannel(realtimeChannel);realtimeChannel=db.channel('event-'+id).on('postgres_changes',{event:'*',schema:'public',table:'registrations',filter:'event_id=eq.'+id},()=>renderDetail()).on('postgres_changes',{event:'*',schema:'public',table:'events',filter:'id=eq.'+id},()=>refresh()).subscribe()}
function setupRealtime(){db.channel('events-list').on('postgres_changes',{event:'*',schema:'public',table:'events'},()=>loadEvents()).subscribe()}
async function refresh(){if(currentEvent){const {data}=await db.from('events').select('*').eq('id',currentEvent.id).maybeSingle();if(data){currentEvent=data;renderDetail()}else{currentEvent=null;showTab('list')}}else loadEvents()}
document.querySelectorAll('.bn').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('newBtn').onclick=async()=>{if(await requireAdmin())showTab('create')};$('createBtn').onclick=createEvent;$('backTop').onclick=()=>{currentEvent=null;showTab('list')};$('backBtn')?.addEventListener('click',()=>{currentEvent=null;showTab('list')});$('rosterBack').onclick=()=>showTab('list');$('signupBack').onclick=()=>showTab('detail');window.addEventListener('hashchange',()=>{const id=location.hash.startsWith('#event=')?location.hash.slice(7):'';if(id)openEvent(id)});setInterval(refresh,3000);setupRealtime();const now=new Date();$('date').value=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);const hash=location.hash.startsWith('#event=')?location.hash.slice(7):'';if(hash)openEvent(hash);else loadEvents();
</script>
</body></html>
