<style>
:root{--blue:#55b9f2;--deep:#12346b;--sky:#dff3ff;--green:#24bd53;--red:#ef5a78;--coffee:#9a7449;--line:#dceaf2}
*{box-sizing:border-box}body{margin:0;background:#f7fbfd;color:#142b55;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;background:#fff}.header{position:relative;overflow:hidden;height:178px;padding:25px 20px 18px;background:linear-gradient(135deg,#29b9ef,#48a8ef 55%,#3a8de8);color:#fff;border-radius:0 0 28px 28px}.brand{font-size:34px;font-weight:900;letter-spacing:1px;text-align:center;margin-top:5px}.sub{text-align:center;font-size:20px;margin-top:10px}.slogan{position:absolute;right:18px;bottom:20px;font-size:13px;line-height:1.55;text-align:right}.racket{position:absolute;left:12px;top:15px;font-size:60px;transform:rotate(-20deg)}.shuttle{position:absolute;left:84px;top:78px;font-size:40px;transform:rotate(18deg)}.hamb{position:absolute;right:17px;top:24px;font-size:34px}.backTop{position:absolute;left:16px;top:25px;font-size:40px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 14px 12px}.nav button{border:0;border-radius:15px;padding:13px 8px;font-size:18px;font-weight:900;color:#253b57;background:#fff;box-shadow:0 2px 12px #4d708522}.nav .on{background:#d9efff;color:#2674bd}.content{padding:0 14px 35px}.hidden{display:none!important}.event-card{display:grid;grid-template-columns:88px 1fr 105px;gap:12px;align-items:center;border:1px solid #dceaf2;border-radius:20px;padding:12px;background:#fff;box-shadow:0 5px 14px #4a6f8414;margin-bottom:12px}.datebox{height:135px;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.pastel1{background:#eaf8ff;color:#2b86ae}.pastel2{background:#fff0f2;color:#8b5c5f}.pastel3{background:#effaf3;color:#22685a}.pastel4{background:#fff8e7;color:#875f23}.date{font-size:27px;font-weight:800;line-height:1.15}.weekday{font-size:20px;margin-top:5px}.latest{font-size:14px;margin-top:8px;padding:3px 12px;border-radius:20px;background:#8bd3fa;color:#fff}.event-title{font-size:22px;font-weight:900;margin-bottom:8px}.event-line{font-size:17px;line-height:1.45;margin:4px 0;color:#364a62}.event-note{font-size:16px;line-height:1.5;color:#ef6676;margin-top:6px}.view{border:0;border-radius:30px;background:#e9edf3;color:#253a56;padding:13px 10px;font-size:17px;font-weight:800;white-space:nowrap}.create-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 15px #4a6f8414}.section-title{font-size:23px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:10px 0 5px;color:#66727c;font-size:15px}input,textarea{width:100%;padding:11px;border:1px solid #d4e0e7;border-radius:10px;font-size:17px}textarea{resize:vertical}.primary{width:100%;margin-top:15px;border:0;border-radius:14px;padding:13px;background:#cdeaff;color:#2476b9;font-size:18px;font-weight:900}.detail-wrap{padding:0 12px 30px}.detail-card{border:1px solid #dceaf2;border-radius:20px;box-shadow:0 4px 14px #4a6f8410;padding:15px;background:#fff}.detail-head{display:grid;grid-template-columns:1fr 125px;gap:10px;align-items:center}.detail-title{font-size:28px;font-weight:900;color:#12346b}.detail-date{font-size:23px;color:#000;margin-top:6px}.detail-time{font-size:22px;margin-top:4px}.detail-venue{font-size:18px;margin-top:8px;color:#364a62}.detail-note{font-size:16px;color:#c08a54;line-height:1.5;margin-top:7px}.attendance{text-align:center;border-left:1px solid #dbe6ee}.count{font-size:48px;font-weight:900;color:#1687e8}.limit{font-size:18px;color:#303b49}.mine{font-size:17px;color:#a67d57;margin-top:6px}.join{width:100%;border:0;border-radius:16px;padding:15px;margin-top:12px;background:linear-gradient(90deg,#2bc65b,#22b64f);color:#fff;font-size:24px;font-weight:900}.actions{background:#e2f3fd;border-radius:16px;padding:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.action{border:0;border-radius:12px;background:#9bd8f7;color:#1762a7;padding:12px 4px;font-size:16px;font-weight:900}.action.cancel{color:#ed4d69}.roster{margin-top:10px;background:#edf8ff;border-radius:16px;padding:12px}.roster-head{display:flex;align-items:center;font-size:21px;font-weight:900;color:#173d78;padding:3px}.chev{margin-left:auto;border:0;background:transparent;font-size:24px;color:#173d78}.roster-list{background:#fff;border-radius:13px;margin-top:7px;padding:5px 9px;display:grid}.cols2{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:repeat(3,1fr);gap:0 8px}.person{min-height:42px;border-bottom:1px solid #e2edf4;display:flex;align-items:center;padding:4px 2px;font-size:19px;color:#000}.num{width:28px;color:#6e757b;font-size:15px}.pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person-actions{margin-left:auto;display:flex}.mini{border:0;background:#eef8ff;color:#2086d2;border-radius:6px;margin-left:2px;padding:2px 4px}.mini.del{color:#ed4d69;background:#fff0f2}.wait{background:#fff3f3;border-radius:10px;margin-top:8px;padding:8px;color:#8a6969;font-size:15px}.admin{margin-top:12px;background:#fff8e8;border-radius:16px;padding:12px}.admin-title{font-size:19px;font-weight:900;color:#a17845;margin-bottom:8px}.admin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.admin-btn{border:0;border-radius:12px;padding:10px 4px;background:#dff3ff;color:#1762a7;font-size:15px;font-weight:900}.admin-btn.red{background:#fff0f2;color:#e7526e}.admin-btn.coffee{background:#fff0e6;color:#a35d35}.admin-status{font-size:14px;color:#a17845;margin:7px 0}.admin-close{width:100%;margin-top:9px;border:0;border-radius:12px;padding:9px;background:#edf0f2;color:#173d78;font-weight:900}.modal{position:fixed;inset:0;background:#173d7855;display:flex;align-items:center;justify-content:center;padding:22px;z-index:99}.modalbox{width:100%;max-width:350px;background:#fff;border-radius:18px;padding:19px;box-shadow:0 15px 50px #0003}.modal-title{font-size:21px;font-weight:900;margin-bottom:10px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.modal-actions button{border:0;border-radius:11px;padding:11px;font-size:16px;font-weight:900}.cancelmodal{background:#eef0f2;color:#58636c}.okmodal{background:#dff3ff;color:#1762a7}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#26343c;color:#fff;padding:10px 15px;border-radius:99px;z-index:120;font-size:15px}.empty{text-align:center;color:#999;padding:30px}.back{border:0;background:transparent;color:#47739a;font-size:17px;font-weight:800;padding:4px 0 9px}
@media(max-width:390px){.event-card{grid-template-columns:76px 1fr 83px;gap:8px}.date{font-size:23px}.event-title{font-size:19px}.event-line{font-size:15px}.view{font-size:14px;padding:11px 6px}.detail-head{grid-template-columns:1fr 105px}.detail-title{font-size:24px}.action{font-size:13px}.admin-btn{font-size:12px}.person{font-size:17px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="backTop">‹</div><div class="racket">🏸</div><div class="shuttle">🏸</div><div class="hamb">☰</div><div class="brand">一起來打羽球</div><div class="sub">煩惱 Out，羽球 In！⌁♡</div><div class="slogan">打球・運動・交朋友<br>讓生活更有活力！</div></header>
<div class="nav"><button id="newBtn">＋ 建立場次</button><button id="listBtn" class="on">▣ 我的場次</button></div>
<main class="content">
<section id="create" class="hidden"><div class="create-card"><div class="section-title">✨ 建立新場次</div><label>日期</label><input id="date" type="date"><div class="grid"><div><label>開始時間</label><input id="start" type="time" value="19:00"></div><div><label>結束時間</label><input id="end" type="time" value="21:00"></div></div><label>場次名稱</label><input id="title" placeholder="例如：週三羽球"><label>球館</label><input id="venue" placeholder="例如：基隆運動中心"><div class="grid"><div><label>場地數</label><input id="courts" type="number" min="1" value="3"></div><div><label>人數上限</label><input id="limit" type="number" min="1" value="21"></div></div><label>備註</label><textarea id="note" rows="3"></textarea><button id="createBtn" class="primary">建立場次</button></div></section>
<section id="list"><div id="events"></div></section>
<section id="detail" class="hidden"><button id="backBtn" class="back">‹ 回我的場次</button><div id="detailCard"></div><div id="rosterCard" class="hidden"></div></section>
</main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div id="modalTitle" class="modal-title"></div><div id="modalBody"></div><div class="modal-actions"><button class="cancelmodal" id="modalCancel">取消</button><button class="okmodal" id="modalOK">確定</button></div></div></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://jrzzdeaovzmgdshfkrrv.supabase.co';const SUPABASE_KEY='sb_publishable_Mkn3j1zIKAbGtlPfHefzBw_LT021nJO';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let currentEvent=null,adminMode=false,modalResolve=null,refreshTimer=null,realtimeChannel=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.add('hidden'),2200)}function showModal(title,html){return new Promise(r=>{$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.remove('hidden');modalResolve=r})}function closeModal(v){$('modal').classList.add('hidden');if(modalResolve){const r=modalResolve;modalResolve=null;r(v)}}$('modalCancel').onclick=()=>closeModal(null);$('modalOK').onclick=()=>{const i=$('modalInput');closeModal(i?i.value:true)};function askText(title,ph,val=''){return showModal(title,`<input id="modalInput" type="text" maxlength="30" placeholder="${esc(ph)}" value="${esc(val)}">`).then(v=>v===null?null:String(v).trim())}async function requireAdmin(){const v=await showModal('🔐 團主管理','<input id="modalInput" type="password" inputmode="numeric" maxlength="8" placeholder="請輸入團主密碼">');return v==='2418'}
function fmtDate(d){let [y,m,day]=String(d).split('-');return `${m}/${day}`}function week(d){return ['日','一','二','三','四','五','六'][new Date(d+'T00:00:00').getDay()]}function fmtTime(t){return String(t||'').slice(0,5)}function myKey(id){return 'badminton_reg_'+id}function myId(id){return localStorage.getItem(myKey(id))||''}function setMy(id,r){localStorage.setItem(myKey(id),r)}function clearMy(id){localStorage.removeItem(myKey(id))}
function showTab(t){$('create').classList.toggle('hidden',t!=='create');$('list').classList.toggle('hidden',t!=='list');$('detail').classList.toggle('hidden',t!=='detail');$('newBtn').classList.toggle('on',t==='create');$('listBtn').classList.toggle('on',t==='list');if(t==='list')loadEvents()}
async function loadEvents(){const {data,error}=await db.from('events').select('*').order('created_at',{ascending:false});if(error){$('events').innerHTML='<div class="empty">讀取失敗，請稍後再試</div>';return}const rows=(data||[]).slice(0,4);if(!rows.length){$('events').innerHTML='<div class="empty">目前還沒有場次</div>';return}let html='';for(let i=0;i<rows.length;i++){const e=rows[i];const {data:r}=await db.from('registrations').select('status').eq('event_id',e.id);const n=(r||[]).filter(x=>x.status==='confirmed').length;html+=`<div class="event-card"><div class="datebox pastel${i+1}"><div class="date">${fmtDate(e.event_date)}</div><div class="weekday">(${week(e.event_date)})</div>${i===0?'<div class="latest">最新</div>':''}</div><div><div class="event-title">🏸 ${esc(e.title)}</div><div class="event-line">📍 ${esc(e.venue||'未提供球館')}　｜ ${e.courts||1} 面場地</div><div class="event-line">◷ ${fmtTime(e.start_time)} - ${fmtTime(e.end_time)}</div><div class="event-line">👥 目前 ${n} / ${e.participant_limit||21} 人</div>${e.notes?`<div class="event-note">▤ ${esc(e.notes)}</div>`:''}</div><button class="view" onclick="openEvent('${e.id}')">查看／報名　›</button></div>`}$('events').innerHTML=html}
async function createEvent(){if(!(await requireAdmin())){toast('密碼錯誤');return}const date=$('date').value,start=$('start').value,end=$('end').value,title=$('title').value.trim();if(!date||!start||!end||!title){toast('請填完整資料');return}if(start>=end){toast('結束時間要晚於開始時間');return}const payload={title,event_date:date,start_time:start,end_time:end,venue:$('venue').value.trim(),courts:+$('courts').value||1,participant_limit:+$('limit').value||21,notes:$('note').value.trim()};const {error}=await db.from('events').insert(payload);if(error){toast('建立失敗：'+error.message);return}const {data:all}=await db.from('events').select('id,created_at').order('created_at',{ascending:false});for(const old of (all||[]).slice(4))await db.from('events').delete().eq('id',old.id);toast('場次建立成功');showTab('list')}
async function openEvent(id){const {data,error}=await db.from('events').select('*').eq('id',id).single();if(error||!data){toast('找不到場次');return}currentEvent=data;adminMode=false;showTab('detail');await renderDetail();subscribeEvent(id)}
async function renderDetail(){if(!currentEvent)return;const {data,error}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).order('registered_at',{ascending:true});if(error){toast('讀取報名資料失敗');return}const regs=data||[],confirmed=regs.filter(r=>r.status==='confirmed'),wait=regs.filter(r=>r.status==='waitlist'),mine=myId(currentEvent.id),mineReg=regs.find(r=>r.id===mine);$('detailCard').innerHTML=`<div class="detail-card"><div class="detail-head"><div><div class="detail-title">🏸 ${esc(currentEvent.title)}</div><div class="detail-date">${fmtDate(currentEvent.event_date)} (${week(currentEvent.event_date)})</div><div class="detail-time">${fmtTime(currentEvent.start_time)} - ${fmtTime(currentEvent.end_time)}</div><div class="detail-venue">📍 ${esc(currentEvent.venue||'未提供球館')}　｜　🏸 ${currentEvent.courts||1} 面場地</div>${currentEvent.notes?`<div class="detail-note">▤ ${esc(currentEvent.notes)}</div>`:''}</div><div class="attendance"><div class="count">${confirmed.length}</div><div class="limit">/ ${currentEvent.participant_limit||21} 人</div><div class="mine">${mineReg?'你已報名':'你未報名'}</div></div></div><button class="join" onclick="join()">👤＋1 報名</button><div class="actions"><button class="action" onclick="joinForOther()">👥 幫朋友報名</button><button class="action cancel" onclick="cancelMine()">✕ 取消報名</button><button class="action" onclick="toggleRoster()">▤ 已報名名單</button></div>${adminMode?adminHtml():''}</div>`;renderRoster(confirmed,wait,mine)}
function adminHtml(){return `<div class="admin"><div class="admin-title">🔒 團主管理</div><div class="admin-status">團主模式（已登入）</div><div class="admin-grid"><button class="admin-btn" onclick="editEvent()">✎ 編輯場次</button><button class="admin-btn red" onclick="deleteEvent()">▢ 刪除場次</button><button class="admin-btn coffee" onclick="toggleRoster(true)">👥 修改／刪除報名</button></div><button class="admin-close" onclick="adminMode=false;renderDetail()">⇥ 關閉團主管理</button></div>`}
function renderRoster(arr,wait,mine){const open=false;let cols=arr.length>=16?'cols3':'cols2',ordered=arr;if(cols==='cols3'){const rows=Math.ceil(arr.length/3),tmp=[];for(let r=0;r<rows;r++)for(let c=0;c<3;c++){const idx=r+c*rows;if(idx<arr.length)tmp.push(arr[idx])}ordered=tmp}$('rosterCard').classList.add('hidden');$('rosterCard').dataset.open='0';$('rosterCard').innerHTML=`<div class="roster"><div class="roster-head">👥 已報名名單 <span style="font-size:16px;margin-left:5px">(${arr.length}人)</span><button class="chev" onclick="toggleRoster()">⌃</button></div><div class="roster-list ${cols}">${ordered.map(r=>`<div class="person"><span class="num">${arr.indexOf(r)+1}.</span><span class="pname">${esc(r.name)}</span><span class="person-actions">${r.id===mine&&!adminMode?`<button class="mini" onclick="editMyReg('${r.id}')">✎</button><button class="mini del" onclick="cancelReg('${r.id}')">▢</button>`:''}${adminMode?`<button class="mini" onclick="editReg('${r.id}')">✎</button><button class="mini del" onclick="adminDeleteReg('${r.id}')">▢</button>`:''}</span></div>`).join('')}</div>${wait.length?`<div class="wait"><b>候補 ${wait.length} 人</b><br>${wait.map((r,i)=>`${i+1}. ${esc(r.name)}${adminMode?`　<button class="mini" onclick="editReg('${r.id}')">✎</button><button class="mini del" onclick="adminDeleteReg('${r.id}')">▢</button>`:''}`).join('<br>')}</div>`:''}</div>`}
function toggleRoster(force=false){const e=$('rosterCard');if(force){e.classList.remove('hidden');e.dataset.open='1';return}if(e.dataset.open==='1'){e.classList.add('hidden');e.dataset.open='0'}else{e.classList.remove('hidden');e.dataset.open='1'}}
async function join(){if(!currentEvent)return;let name=localStorage.getItem('badminton_name')||'';if(!name)name=await askText('第一次報名','請輸入你的姓名');if(!name)return;localStorage.setItem('badminton_name',name);const {data:old}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).eq('name',name).maybeSingle();if(old){setMy(currentEvent.id,old.id);toast('你已經報名過了');return}const {data:all}=await db.from('registrations').select('status').eq('event_id',currentEvent.id);const n=(all||[]).filter(x=>x.status==='confirmed').length;const status=n<(currentEvent.participant_limit||21)?'confirmed':'waitlist';const {data:r,error}=await db.from('registrations').insert({event_id:currentEvent.id,name,status}).select().single();if(error){toast('報名失敗：'+error.message);return}setMy(currentEvent.id,r.id);toast(status==='confirmed'?'報名成功！':'已額滿，加入候補');renderDetail()}
async function joinForOther(){if(!currentEvent)return;const name=await askText('幫朋友報名','請輸入朋友姓名');if(!name)return;const {data:old}=await db.from('registrations').select('id').eq('event_id',currentEvent.id).eq('name',name).maybeSingle();if(old){toast(`${name} 已經報名過了`);return}const {data:all}=await db.from('registrations').select('status').eq('event_id',currentEvent.id);const n=(all||[]).filter(x=>x.status==='confirmed').length;const status=n<(currentEvent.participant_limit||21)?'confirmed':'waitlist';const {error}=await db.from('registrations').insert({event_id:currentEvent.id,name,status});if(error){toast('代報名失敗：'+error.message);return}toast(status==='confirmed'?`${name} 報名成功！`:`已額滿，${name} 加入候補`);renderDetail()}
async function cancelMine(){const id=myId(currentEvent.id);if(!id){toast('你目前沒有報名');return}const ok=await showModal('取消報名','<div>確定要取消你的報名嗎？</div>');if(ok===null)return;cancelReg(id)}
async function cancelReg(id,admin=false){if(!admin&&id!==myId(currentEvent.id)){toast('只能取消自己的報名');return}const {data:r}=await db.from('registrations').select('*').eq('id',id).single();if(!r)return;const {error}=await db.from('registrations').delete().eq('id',id);if(error){toast('取消失敗');return}if(id===myId(currentEvent.id))clearMy(currentEvent.id);if(r.status==='confirmed'){const {data:w}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).eq('status','waitlist').order('registered_at',{ascending:true}).limit(1);if(w&&w[0])await db.from('registrations').update({status:'confirmed'}).eq('id',w[0].id)}toast('已取消報名');renderDetail()}
async function editMyReg(id){if(id!==myId(currentEvent.id)){toast('只能修改自己的報名');return}editReg(id,false)}async function editReg(id,admin=true){if(admin&&!adminMode){toast('請先開啟團主管理');return}const {data:r}=await db.from('registrations').select('*').eq('id',id).single();if(!r)return;const name=await askText('修改姓名','請輸入新的姓名',r.name);if(!name||name===r.name)return;const {data:dup}=await db.from('registrations').select('id').eq('event_id',currentEvent.id).eq('name',name).neq('id',id).maybeSingle();if(dup){toast(`${name} 已經報名過了`);return}const {error}=await db.from('registrations').update({name}).eq('id',id);if(error){toast('修改失敗');return}if(id===myId(currentEvent.id))localStorage.setItem('badminton_name',name);toast('姓名已修改');renderDetail()}
async function adminDeleteReg(id){if(!adminMode)return;const ok=await showModal('刪除報名','<div>確定要刪除這筆報名嗎？</div>');if(ok===null)return;cancelReg(id,true)}
async function editEvent(){if(!(await requireAdmin())){toast('密碼錯誤');return}const html=`<div class="create-card"><label>日期</label><input id="ed" type="date" value="${currentEvent.event_date}"><div class="grid"><div><label>開始</label><input id="es" type="time" value="${fmtTime(currentEvent.start_time)}"></div><div><label>結束</label><input id="ee" type="time" value="${fmtTime(currentEvent.end_time)}"></div></div><label>場次名稱</label><input id="et" value="${esc(currentEvent.title)}"><label>球館</label><input id="ev" value="${esc(currentEvent.venue||'')}"><div class="grid"><div><label>場地數</label><input id="ec" type="number" value="${currentEvent.courts||1}"></div><div><label>人數上限</label><input id="el" type="number" value="${currentEvent.participant_limit||21}"></div></div><label>備註</label><textarea id="en" rows="3">${esc(currentEvent.notes||'')}</textarea><button class="primary" onclick="saveEventEdit()">儲存修改</button></div>`;$('detailCard').insertAdjacentHTML('beforeend',html)}async function saveEventEdit(){const p={event_date:$('ed').value,start_time:$('es').value,end_time:$('ee').value,title:$('et').value.trim(),venue:$('ev').value.trim(),courts:+$('ec').value||1,participant_limit:+$('el').value||21,notes:$('en').value.trim()};const {data,error}=await db.from('events').update(p).eq('id',currentEvent.id).select().single();if(error){toast('修改失敗');return}currentEvent=data;toast('場次已修改');renderDetail()}
async function deleteEvent(){if(!(await requireAdmin())){toast('密碼錯誤');return}const ok=await showModal('刪除場次','<div>確定刪除這個場次？<br>所有報名資料也會一起刪除。</div>');if(ok===null)return;const {error}=await db.from('events').delete().eq('id',currentEvent.id);if(error){toast('刪除失敗');return}currentEvent=null;toast('場次已刪除');showTab('list')}
async function enterAdmin(){if(await requireAdmin()){adminMode=true;renderDetail()}}function subscribeEvent(id){if(realtimeChannel)db.removeChannel(realtimeChannel);realtimeChannel=db.channel('event-'+id).on('postgres_changes',{event:'*',schema:'public',table:'registrations',filter:'event_id=eq.'+id},()=>renderDetail()).on('postgres_changes',{event:'*',schema:'public',table:'events',filter:'id=eq.'+id},()=>refresh()).subscribe()}function setupRealtime(){db.channel('events-list').on('postgres_changes',{event:'*',schema:'public',table:'events'},()=>loadEvents()).subscribe()}async function refresh(){if(currentEvent){const {data}=await db.from('events').select('*').eq('id',currentEvent.id).maybeSingle();if(data){currentEvent=data;renderDetail()}}else loadEvents()}
$('newBtn').onclick=async()=>{if(await requireAdmin())showTab('create')};$('listBtn').onclick=()=>showTab('list');$('createBtn').onclick=createEvent;$('backBtn').onclick=()=>{currentEvent=null;showTab('list')};window.addEventListener('hashchange',()=>{const id=location.hash.startsWith('#event=')?location.hash.slice(7):'';if(id)openEvent(id)});setInterval(refresh,3000);setupRealtime();const now=new Date();$('date').value=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);const hash=location.hash.startsWith('#event=')?location.hash.slice(7):'';if(hash)openEvent(hash);else loadEvents();
</script>
</body></html>
