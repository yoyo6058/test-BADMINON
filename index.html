*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:var(--text);background:var(--bg)}button,input,textarea,select{font:inherit}html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%;}button{border:0;cursor:pointer}.app{width:100%;max-width:620px;margin:0 auto;min-height:100dvh;padding-bottom:100px}.header{background:var(--navy);color:#fff;padding:18px 20px 17px;text-align:center}.header h1{display:inline-block;font-size:22px;margin:0;font-weight:700;letter-spacing:.08em;position:relative}.header h1 .header-icon{position:absolute;left:-44px;right:auto;top:50%;transform:translateY(-50%);width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}.header p{max-width:430px;margin:4px auto 0;padding-right:20px;text-align:right;font-size:12px;opacity:.82}.page{padding:18px 16px}.screen{display:none}.screen.active{display:block}.section-title{font-size:18px;font-weight:700;margin:2px 2px 14px}.event-card,.info-card,.form-card,.roster-card,.success-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.event-card{padding:10px 17px;margin-bottom:12px}.event-top{display:flex;gap:14px;align-items:center}.date{width:78px;flex:none;text-align:center;color:var(--navy);font-weight:800;line-height:1.05}.date b{display:block;font-size:18px}.date span{font-size:11px}.event-main{min-width:0;flex:1}.event-title{font-size:16px;color:var(--navy);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-time{font-size:15px;color:var(--muted);margin-top:4px}.event-actions{display:flex;gap:10px;margin-top:14px}.btn{min-height:46px;border-radius:12px;padding:0 16px;font-weight:700}.btn-primary{background:var(--navy);color:#fff;border:1px solid #183b57}.btn-soft{background:#fff;border:1px solid #cbdce8;color:var(--navy)}.btn-green{background:var(--green);color:#fff;border:1px solid #3f8e5f}.btn-pink{background:var(--pink);color:#fff;border:1px solid #dc9aa5}.event-actions .btn-soft,.action-grid .btn-soft{background:#f3f8fc;border:1px solid #cfe0ed;color:var(--navy)}.event-actions .btn-green{background:#effaf3;border:1px solid #c9e4d4;color:#4d9568}.action-grid .btn-green{background:#effaf3;border:1px solid #c9e4d4;color:#4d9568}.action-grid .btn-pink{background:#fff2f4;border:1px solid #efcfd5;color:#d7838f}.btn-full{width:100%}.event-actions .btn{flex:1;font-size:14px}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.info-card{padding:18px;margin-bottom:14px}.signup-info-card{padding:11px 18px}.info-grid{display:grid;grid-template-columns:78px 1fr;gap:3px 16px;align-items:start}.info-date{text-align:center;color:var(--navy);font-weight:800;border-right:1px solid var(--line);padding-right:12px;grid-row:1/5;display:flex;flex-direction:column;justify-content:center;align-items:center}.info-date b{font-size:21px;display:block}.info-date span{font-size:13px}.info-title{font-size:17px;font-weight:750;color:var(--navy)}.info-line{font-size:15px;color:var(--muted);margin-top:3px}.count{text-align:center;font-size:15px;margin:13px 0;color:var(--muted)}.detail-count{margin:3px 0 7px}.count strong{font-size:28px;color:#d95362}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action-grid>*{min-width:0}.action-grid .btn{font-size:15px}.admin{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.admin summary{padding:13px 15px;color:var(--navy);font-weight:700;font-size:14px;cursor:pointer}.admin-body{padding:12px;border-top:1px solid var(--line);display:grid;gap:9px}.form-card{padding:18px}.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--navy)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--text);outline:none}.field input:focus,.field textarea:focus{border-color:var(--navy)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bottom{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(calc(100% - 32px),588px);display:flex;gap:10px}.keyboard-open .bottom{display:none!important}.bottom .btn{flex:1;box-shadow:0 4px 15px rgba(0,0,0,.08)}.person-icon{width:19px;height:19px;display:inline-block;vertical-align:-4px;margin-right:3px;stroke:currentColor;fill:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.success-card{text-align:center;padding:28px 20px}.success-mark{width:58px;height:58px;border-radius:50%;background:#e7f5ed;color:var(--green);display:grid;place-items:center;margin:0 auto 12px;font-size:30px}.success-card h2{margin:0 0 8px;color:var(--navy)}.success-detail{font-size:15px;line-height:1.8;color:var(--muted)}.success-name{font-size:16px;color:var(--navy);font-weight:800}.record{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:10px}.record .rdate{color:var(--navy);font-weight:800}.record .rtitle{font-size:17px;margin-top:3px}.record .rtime{font-size:13px;color:var(--muted);margin-top:3px}.person{display:flex;align-items:center;gap:10px;padding:11px 3px;border-bottom:1px solid #edf2f6;min-width:0}.person:last-child{border-bottom:0}.person-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person-actions{display:flex;align-items:center;gap:8px;flex:none}.badge{font-size:12px;color:var(--green);font-weight:700;white-space:nowrap}.badge-confirmed{background:#eaf7ef;color:#4d9568;padding:4px 9px;border-radius:999px}.trash-btn{width:38px;height:38px;min-width:38px;padding:0;border-radius:50%;background:#fdecef;color:#df4353;display:grid;place-items:center;border:1px solid #f4c4cb}.trash-btn svg{width:25px;height:25px;display:block}.trash-btn:active{background:#f9dfe4;transform:scale(.97)}.roster-card{padding:9px 18px}.roster-card .info-title{font-size:18px}.roster-action{width:100%;margin-top:10px}.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.35)}.modal.show{display:flex}.modal-card{width:min(100%,360px);background:#fff;border-radius:18px;padding:22px 20px;box-shadow:0 12px 35px rgba(0,0,0,.18);text-align:center}.modal-title{font-size:17px;font-weight:700;color:var(--text);line-height:1.5;margin-bottom:18px;word-break:break-word}.modal-actions{display:flex;gap:10px}.modal-actions .btn{flex:1}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#263746;color:#fff;padding:10px 15px;border-radius:10px;font-size:13px;display:none;z-index:30;max-width:calc(100% - 32px);text-align:center}.small{font-size:13px;color:var(--muted)}.name-tools{margin-top:10px;text-align:left}.name-tools button{background:transparent;color:var(--navy);font-size:14px;font-weight:700;text-decoration:underline;padding:6px 8px}.password-input{width:100%;box-sizing:border-box;letter-spacing:.25em;text-align:center;font-size:20px;font-weight:700;-webkit-text-security:disc;text-security:disc}@media(min-width:700px){.app{max-width:680px}.header{border-radius:0 0 18px 18px}.page{padding:22px 20px}}

<body><main class="app">
<header class="header"><h1><span class="header-icon" aria-hidden="true">🏸</span>打球・動起來～♡</h1><p>打球・運動・交朋友</p></header>
<section id="list" class="screen active"><div class="page"><div class="section-title">近期場次</div><div id="eventList"></div></div><div class="bottom"><button class="btn btn-primary" onclick="openCreate()">＋ 建立場次</button></div></section>
<section id="detail" class="screen"><div class="page"><div id="detailCard"></div></div><div class="bottom"><button class="btn btn-primary" onclick="show('list')">返回場次</button></div></section>
<section id="signup" class="screen"><div class="page"><div id="signupCard"></div></div><div class="bottom"><button class="btn btn-primary" onclick="confirmSignup()">確認報名</button><button class="btn btn-soft" onclick="show('detail')">返回</button></div></section>
<section id="success" class="screen"><div class="page"><div class="success-card"><div class="success-mark">✓</div><h2>報名成功</h2><div id="successDetail" class="success-detail"></div></div></div><div class="bottom"><button class="btn btn-primary" onclick="showRoster()">查看名單</button><button class="btn btn-soft" onclick="show('detail')">返回</button></div></section>
<section id="roster" class="screen"><div class="page"><div id="rosterCard"></div></div><div class="bottom"><button class="btn btn-primary" onclick="show('list')">返回首頁</button></div></section>
<section id="create" class="screen"><div class="page"><div class="section-title">建立新場次</div><div class="form-card"><div class="field"><label>活動名稱</label><input id="fTitle" placeholder="例如：In羽out"></div><div class="two"><div class="field"><label>日期</label><input id="fDate" type="date"></div><div class="field"><label>開始時間</label><input id="fStart" type="time"></div></div><div class="field"><label>結束時間</label><input id="fEnd" type="time"></div><div class="field"><label>球館</label><input id="fVenue" placeholder="例如：基隆運動中心"></div><div class="two"><div class="field"><label>場地數</label><input id="fCourts" type="number" min="1" value="3"></div><div class="field"><label>人數上限</label><input id="fLimit" type="number" min="1" value="20"></div></div><div class="field"><label>備註</label><textarea id="fNotes" rows="3" placeholder="可留空"></textarea></div></div></div><div class="bottom"><button id="createSubmit" type="button" class="btn btn-primary">建立場次</button><button class="btn btn-soft" onclick="show('list')">返回</button></div></section>
<section id="records" class="screen"><div class="page"><div class="section-title">我的紀錄</div><div id="recordsList"></div></div><div class="bottom"><button class="btn btn-soft" onclick="show('list')">返回</button><button class="btn btn-primary" onclick="show('list')">首頁</button></div></section>
<div id="toast" class="toast"></div><div id="passwordModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal-card"><div id="passwordModalTitle" class="modal-title"></div><input id="passwordInput" class="field input password-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" aria-label="密碼"><div class="modal-actions" style="margin-top:16px"><button id="passwordConfirmBtn" class="btn btn-primary">確認</button><button id="passwordCancelBtn" class="btn btn-soft">取消</button></div></div></div><div id="cancelModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal-card"><div id="cancelModalTitle" class="modal-title"></div><div class="modal-actions"><button id="cancelConfirmBtn" class="btn btn-pink">取消報名</button><button id="cancelBackBtn" class="btn btn-soft">再想想</button></div></div></div></main>
<script>
const SUPABASE_URL='https://gtwoqtclkyvujvoxfygq.supabase.co';
const SUPABASE_KEY='sb_publishable_Bx610qU2vq2qSKY1c_1K7g_ewIxt4eu';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let events=[],regs=[],currentEvent=null,currentReg=null;
const $=id=>document.getElementById(id);
function toast(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.style.display='none',2200)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');document.documentElement.classList.remove('keyboard-open');if(id==='list')loadEvents();if(id==='records')loadRecords();window.scrollTo(0,0)}
function fmtDate(d){const x=new Date(d+'T00:00:00');return {m:String(x.getMonth()+1).padStart(2,'0'),d:String(x.getDate()).padStart(2,'0'),w:['日','一','二','三','四','五','六'][x.getDay()]}}
function time(t){return (t||'').slice(0,5)}
async function loadEvents(){const {data,error}=await db.from('events').select('*').order('created_at',{ascending:false});if(error){toast('場次讀取失敗');return}events=data||[];if(events.length>4){const oldIds=events.slice(4).map(e=>e.id);const {error:deleteOldError}=await db.from('events').delete().in('id',oldIds);if(deleteOldError){console.error('cleanup old events:',deleteOldError);toast('舊場次清理失敗');return}events=events.slice(0,4)}const html=await Promise.all(events.map(async e=>{const {count}=await db.from('registrations').select('*',{count:'exact',head:true}).eq('event_id',e.id).eq('status','confirmed');const d=fmtDate(e.event_date);return `<article class="event-card"><div class="event-top"><div class="date"><b>${d.m}/${d.d}</b><span>週${d.w}</span></div><div class="event-main"><div class="event-title">${esc(e.title)}</div><div class="event-time">${time(e.start_time)}－${time(e.end_time)}</div></div></div><div class="event-actions"><button class="btn btn-soft" onclick="openRosterForEvent('${e.id}')">報名名單</button><button class="btn btn-green" onclick="openDetail('${e.id}')">查看/報名</button></div><div class="small">${count||0} / ${e.participant_limit||20} 人</div></article>`}));$('eventList').innerHTML=html.join('')||'<div class="empty">目前還沒有場次<br>建立第一場羽球活動吧！</div>'}
function openDetail(id){currentEvent=events.find(e=>e.id===id);if(!currentEvent)return;renderDetail();show('detail')}
async function openRosterForEvent(id){currentEvent=events.find(e=>e.id===id)||null;if(!currentEvent)return;await showRoster()}
async function renderDetail(){const e=currentEvent;const {data}=await db.from('registrations').select('*').eq('event_id',e.id).order('registered_at',{ascending:true});regs=data||[];const d=fmtDate(e.event_date);const remembered=localStorage.getItem('badminton_name')||'';const mine=remembered?regs.find(r=>r.name===remembered):null;$('detailCard').innerHTML=`<div class="info-card signup-info-card"><div class="info-grid"><div class="info-date"><b>${d.m}/${d.d}</b><span>週${d.w}</span></div><div class="info-title">${esc(e.title)}</div><div class="info-line">${time(e.start_time)}－${time(e.end_time)}</div><div class="info-line">${esc(e.venue||'未填球館')} ・ ${e.courts||3} 面</div><div class="info-line">${e.notes?esc(e.notes):''}</div></div></div><div class="count detail-count"><strong>${regs.filter(r=>r.status==='confirmed').length}</strong> / ${e.participant_limit||20} 人</div><div class="action-grid"><button class="btn btn-green" onclick="openSignup('${e.id}','self')"><svg class="person-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 19.5c.7-3.4 3.2-5.5 6.5-5.5s5.8 2.1 6.5 5.5"></path></svg>＋1 報名</button><button class="btn btn-green" onclick="openSignup('${e.id}','friend')">幫朋友報名</button><button class="btn btn-pink" onclick="cancelMyRegistration()">取消報名</button><button class="btn btn-soft" onclick="showRoster()">報名名單</button></div>${remembered?`<div class="name-tools"><button type="button" onclick="changeMyName()">修改本人姓名</button></div>`:''}<details class="admin"><summary>🔒 團主管理</summary><div class="admin-body"><button class="btn btn-soft" onclick="editEvent()">編輯場次</button><button class="btn btn-soft" onclick="deleteEvent()">刪除場次</button></div></details></div>`}
async function openSignup(id,mode='self'){currentEvent=events.find(e=>e.id===id)||currentEvent;if(!currentEvent)return;const remembered=localStorage.getItem('badminton_name')||'';const isSelf=mode==='self';if(isSelf&&remembered){const {data,error}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).eq('name',remembered).limit(1);if(error)return toast('報名檢查失敗，請稍後再試');if(data&&data.length){return toast('你已經報名了！')}await registerName(remembered,'self');return}$('signupCard').innerHTML=`<div class="info-card signup-info-card"><div class="info-grid"><div class="info-date"><b>${fmtDate(currentEvent.event_date).m}/${fmtDate(currentEvent.event_date).d}</b><span>週${fmtDate(currentEvent.event_date).w}</span></div><div class="info-title">${esc(currentEvent.title)}</div><div class="info-line">${time(currentEvent.start_time)}－${time(currentEvent.end_time)}</div><div class="info-line">${esc(currentEvent.venue||'未填球館')} ・ ${currentEvent.courts||3} 面</div></div></div><div class="form-card"><div class="field"><label>${isSelf?'＋1 報名':'幫朋友報名'}</label><input id="signupName" value="" placeholder="請輸入姓名"></div>${isSelf?`<label class="remember"><input id="rememberName" type="checkbox"> <span>記住我的名字</span></label>`:''}<div class="small">${isSelf?'報名自己的名字。':'請輸入朋友的姓名。'}</div></div>`;$('signup').dataset.mode=mode;show('signup')}
async function confirmSignup(){const mode=$('signup').dataset.mode||'self';const name=$('signupName').value.trim();if(!name)return toast('請先輸入姓名');if(mode==='self'){if($('rememberName')?.checked)localStorage.setItem('badminton_name',name);else localStorage.removeItem('badminton_name');}await registerName(name,mode)}
async function registerName(name,mode){const {data:existing,error:checkError}=await db.from('registrations').select('id,status,name').eq('event_id',currentEvent.id).eq('name',name).limit(1);if(checkError)return toast('報名檢查失敗，請稍後再試');if(existing&&existing.length){if(mode==='self')await renderDetail();else toast('你已經報名囉！');return}const {count}=await db.from('registrations').select('*',{count:'exact',head:true}).eq('event_id',currentEvent.id).eq('status','confirmed');const status=(count||0)>=(currentEvent.participant_limit||20)?'waitlist':'confirmed';const {data,error}=await db.from('registrations').insert({event_id:currentEvent.id,name,status}).select().single();if(error){if(error.code==='23505'||/duplicate|unique/i.test(error.message||''))return toast('你已經報名囉！');return toast('報名失敗，請稍後再試')}if(mode==='self')setMine(currentEvent.id,data.id);currentReg=data;showSuccess(data,status==='waitlist')}
function showSuccess(r,wait){const d=fmtDate(currentEvent.event_date);$('successDetail').innerHTML=`<div>${d.m}/${d.d}　${esc(currentEvent.title)}</div><div>${time(currentEvent.start_time)}－${time(currentEvent.end_time)}</div><div><span class="success-name">${esc(r.name)}</span> ${wait?'（候補中）':'已加入報名名單'}</div>`;show('success')}
async function showRoster(){if(!currentEvent)return;const {data,error}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).order('registered_at',{ascending:true});if(error)return toast('名單讀取失敗');regs=data||[];const confirmed=regs.filter(r=>r.status==='confirmed'),wait=regs.filter(r=>r.status==='waitlist');$('rosterCard').innerHTML=`<div class="roster-card"><div class="info-title">${esc(currentEvent.title)}</div><div class="small" style="margin:4px 0 12px">${fmtDate(currentEvent.event_date).m}/${fmtDate(currentEvent.event_date).d}　${time(currentEvent.start_time)}－${time(currentEvent.end_time)}</div><div class="count"><strong>${confirmed.length}</strong> / ${currentEvent.participant_limit||20} 人</div>${confirmed.map((r,i)=>personRow(r,i+1,'已報名')).join('')}${wait.length?`<div class="small" style="margin-top:14px">候補</div>${wait.map((r,i)=>personRow(r,i+1,'候補')).join('')}`:''}</div>`;show('roster')}
function personRow(r,num,status){return `<div class="person"><span class="person-name">${num}. ${esc(r.name)}</span><span class="person-actions"><button class="trash-btn" title="取消報名" aria-label="取消${esc(r.name)}的報名" onclick="cancelRegistration('${r.id}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h10l-.7 11H7.7L7 8Zm2-4h6l1 2H8l1-2Zm-4 2h14v2H5V6Z" fill="currentColor"/><path d="M10 10h1v7h-1zm3 0h1v7h-1z" fill="#fff"/></svg></button><span class="badge ${status==='已報名'?'badge-confirmed':''}">${status}</span></span></div>`}
function askCancel(name){return new Promise(resolve=>{const modal=$('cancelModal'),title=$('cancelModalTitle'),yes=$('cancelConfirmBtn'),no=$('cancelBackBtn');title.textContent=`確定要取消「${name}」的報名嗎？`;modal.classList.add('show');modal.setAttribute('aria-hidden','false');const close=value=>{modal.classList.remove('show');modal.setAttribute('aria-hidden','true');yes.onclick=null;no.onclick=null;resolve(value)};yes.onclick=()=>close(true);no.onclick=()=>close(false)} )}
async function cancelRegistration(id){const r=regs.find(x=>x.id===id);if(!r)return;if(!(await askCancel(r.name)))return;const {error}=await db.from('registrations').delete().eq('id',id).eq('event_id',currentEvent.id);if(error)return toast('取消失敗：'+(error.message||'請稍後再試'));if(localStorage.getItem('badminton_reg_'+currentEvent.id)===id)localStorage.removeItem('badminton_reg_'+currentEvent.id);if(r.status==='confirmed'){const {data:wait}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).eq('status','waitlist').order('registered_at',{ascending:true}).limit(1);if(wait&&wait[0])await db.from('registrations').update({status:'confirmed'}).eq('id',wait[0].id)}toast('已取消報名');await showRoster()}
function getMine(id){const name=localStorage.getItem('badminton_name')||'';return regs.find(r=>r.event_id===id&&r.name===name)||null}function setMine(id,rid){localStorage.setItem('badminton_reg_'+id,rid)}
async function changeMyName(){const oldName=localStorage.getItem('badminton_name')||'';const name=window.prompt(oldName?'請輸入新的本人姓名：':'請輸入本人姓名：',oldName);if(name===null)return;const next=name.trim();if(!next)return toast('請輸入姓名');if(next===oldName)return;localStorage.setItem('badminton_name',next);toast('本人姓名已更新');await renderDetail()}
async function cancelMyRegistration(){if(!currentEvent)return;const remembered=localStorage.getItem('badminton_name')||'';if(!remembered)return toast('尚未記住你的名字');const {data:mineRows,error:findError}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).eq('name',remembered).limit(1);if(findError)return toast('取消檢查失敗，請稍後再試');const mine=mineRows&&mineRows[0];if(!mine)return toast('你目前沒有報名這個場次');if(!(await askCancel(mine.name)))return;const {error}=await db.from('registrations').delete().eq('id',mine.id).eq('event_id',currentEvent.id);if(error){console.error(error);return toast('取消失敗：'+(error.message||'請稍後再試'))}localStorage.removeItem('badminton_reg_'+currentEvent.id);if(mine.status==='confirmed'){const {data:wait}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).eq('status','waitlist').order('registered_at',{ascending:true}).limit(1);if(wait&&wait[0])await db.from('registrations').update({status:'confirmed'}).eq('id',wait[0].id)}toast('已取消報名');await renderDetail()}
function requirePassword(action){return new Promise(resolve=>{const modal=$('passwordModal'),title=$('passwordModalTitle'),input=$('passwordInput'),yes=$('passwordConfirmBtn'),no=$('passwordCancelBtn');title.textContent=action+'請輸入密碼';input.value='';modal.classList.add('show');modal.setAttribute('aria-hidden','false');const close=value=>{modal.classList.remove('show');modal.setAttribute('aria-hidden','true');yes.onclick=null;no.onclick=null;input.onkeydown=null;resolve(value)};yes.onclick=()=>{const p=input.value;if(p!=='2418'){toast('密碼錯誤');input.value='';input.focus();return}close(true)};no.onclick=()=>close(false);input.onkeydown=e=>{if(e.key==='Enter')yes.click()};setTimeout(()=>{input.focus();input.select()},60)})}
document.addEventListener('input',e=>{if(e.target.id==='passwordInput')e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)});
let formControlFocused=false;
let keyboardSyncTimer=null;
function setKeyboardOpen(open){document.documentElement.classList.toggle('keyboard-open',!!open)}
function updateKeyboardState(){
 const vv=window.visualViewport;
 const active=document.activeElement;
 const focused=!!(active&&active.matches&&active.matches('input,textarea,select'));
 const keyboardLikely=vv ? ((window.innerHeight-vv.height)>100) : focused;
 formControlFocused=focused;
 setKeyboardOpen(keyboardLikely||focused);
 if(!focused&&!keyboardLikely)setKeyboardOpen(false);
}
function scheduleKeyboardSync(){
 clearTimeout(keyboardSyncTimer);
 updateKeyboardState();
 keyboardSyncTimer=setTimeout(()=>{updateKeyboardState();setTimeout(updateKeyboardState,120)},60);
}
if(window.visualViewport){
 window.visualViewport.addEventListener('resize',scheduleKeyboardSync);
 window.visualViewport.addEventListener('scroll',scheduleKeyboardSync);
}
document.addEventListener('focusin',e=>{
 if(e.target.matches('input,textarea,select')){
   formControlFocused=true;
   setKeyboardOpen(true);
   scheduleKeyboardSync();
 }
});
document.addEventListener('focusout',()=>{
 formControlFocused=false;
 setKeyboardOpen(true);
 setTimeout(scheduleKeyboardSync,120);
 setTimeout(scheduleKeyboardSync,350);
});
window.addEventListener('resize',scheduleKeyboardSync);

async function openCreate(){if(await requirePassword('建立場次：'))show('create')}
document.addEventListener('click',async e=>{const summary=e.target.closest('.admin summary');if(!summary)return;e.preventDefault();if(await requirePassword('團主管理：'))summary.parentElement.open=!summary.parentElement.open});
async function createEvent(){
 const btn=$('createSubmit');
 if(btn.disabled)return;
 const title=$('fTitle').value.trim();
 const date=$('fDate').value;
 const start=$('fStart').value;
 const end=$('fEnd').value;
 if(!title||!date||!start||!end){return toast('請填寫活動名稱、日期與時間')}
 if(end<=start){return toast('結束時間要晚於開始時間')}
 const payload={title,event_date:date,start_time:start,end_time:end,venue:$('fVenue').value.trim(),courts:Math.max(1,Number($('fCourts').value)||3),participant_limit:Math.max(1,Number($('fLimit').value)||20),notes:$('fNotes').value.trim(),created_at:new Date().toISOString()};
 btn.disabled=true;btn.textContent='建立中…';
 try{
   const {error}=await db.from('events').insert(payload);
   if(error){console.error('createEvent:',error);toast('建立失敗：'+(error.message||'請檢查 Supabase 權限'));return}
   const {data:allEvents,error:orderError}=await db.from('events').select('id,created_at').order('created_at',{ascending:false});
   if(orderError){console.error('enforce event limit:',orderError);toast('場次已建立，但排序資料讀取失敗');return}
   const oldIds=(allEvents||[]).slice(4).map(e=>e.id);
   if(oldIds.length){
     const {error:deleteOldError}=await db.from('events').delete().in('id',oldIds);
     if(deleteOldError){console.error('delete oldest events:',deleteOldError);toast('場次已建立，但舊場次刪除失敗');return}
   }
   $('fTitle').value='';$('fDate').value='';$('fStart').value='';$('fEnd').value='';$('fVenue').value='';$('fCourts').value='3';$('fLimit').value='20';$('fNotes').value='';
   toast('場次已建立');
   await loadEvents();
   show('list');
 }catch(err){
   console.error('createEvent exception:',err);
   toast('建立失敗：'+(err?.message||'網路連線或 Supabase 發生問題'));
 }finally{
   btn.disabled=false;btn.textContent='建立場次';
 }
}
async function deleteEvent(){if(!currentEvent)return;if(!confirm('確定刪除這個場次嗎？'))return;const {error}=await db.from('events').delete().eq('id',currentEvent.id);if(error)return toast('刪除失敗');currentEvent=null;show('list')}
async function editEvent(){if(!currentEvent)return;const e=currentEvent;const card=$('detailCard');card.innerHTML=`<div class="form-card"><div class="field"><label>活動名稱</label><input id="eTitle" value="${esc(e.title)}"></div><div class="two"><div class="field"><label>日期</label><input id="eDate" type="date" value="${e.event_date}"></div><div class="field"><label>開始</label><input id="eStart" type="time" value="${time(e.start_time)}"></div></div><div class="field"><label>結束</label><input id="eEnd" type="time" value="${time(e.end_time)}"></div><div class="field"><label>球館</label><input id="eVenue" value="${esc(e.venue||'')}"></div><div class="two"><div class="field"><label>場地數</label><input id="eCourts" type="number" value="${e.courts||3}"></div><div class="field"><label>人數上限</label><input id="eLimit" type="number" value="${e.participant_limit||20}"></div></div><div class="field"><label>備註</label><textarea id="eNotes" rows="3">${esc(e.notes||'')}</textarea></div><button class="btn btn-primary btn-full" onclick="saveEvent()">儲存修改</button></div>`}
async function saveEvent(){const {data,error}=await db.from('events').update({title:$('eTitle').value.trim(),event_date:$('eDate').value,start_time:$('eStart').value,end_time:$('eEnd').value,venue:$('eVenue').value.trim(),courts:+$('eCourts').value||3,participant_limit:+$('eLimit').value||20,notes:$('eNotes').value.trim()}).eq('id',currentEvent.id).select().single();if(error)return toast('修改失敗');currentEvent=data;toast('已儲存');renderDetail()}
async function loadRecords(){const name=localStorage.getItem('badminton_name');if(!name){$('recordsList').innerHTML='<div class="empty">尚無紀錄</div>';return}const {data}=await db.from('registrations').select('*,events(*)').eq('name',name).order('registered_at',{ascending:false});const rows=data||[];$('recordsList').innerHTML=rows.map(r=>`<div class="record"><div class="rdate">${r.events?.event_date||''}</div><div class="rtitle">${esc(r.events?.title||'')}</div><div class="rtime">${time(r.events?.start_time)}－${time(r.events?.end_time)}　${r.status==='waitlist'?'候補':'已報名'}</div></div>`).join('')||'<div class="empty">尚無紀錄</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('createSubmit').addEventListener('click',createEvent);
loadEvents();setInterval(()=>{if(document.querySelector('#list.active'))loadEvents()},5000);
</script></body></html>
