async function loadEvents(){const {data,error}=await db.from('events').select('*').order('created_at',{ascending:false});if(error){toast('場次讀取失敗');return}events=data||[];if(events.length>4){const oldIds=events.slice(4).map(e=>e.id);const {error:deleteOldError}=await db.from('events').delete().in('id',oldIds);if(deleteOldError){console.error('cleanup old events:',deleteOldError);toast('舊場次清理失敗');return}events=events.slice(0,4)}const html=await Promise.all(events.map(async e=>{const {count}=await db.from('registrations').select('*',{count:'exact',head:true}).eq('event_id',e.id).eq('status','confirmed');const d=fmtDate(e.event_date);const ended=isEnded(e);return `<article class="event-card${ended?' ended':''}"><div class="event-top"><div class="date"><b>${d.m}/${d.d}</b><span>週${d.w}</span></div><div class="event-main"><div class="event-title">${iconRacket()}${esc(e.title)}${ended?'<span class="ended-badge">已結束</span>':''}</div><div class="event-time">${iconTime()}${time(e.start_time)}－${time(e.end_time)}</div></div></div>${ended?'':`<div class="event-actions"><button class="btn btn-list" onclick="openRosterForEvent('${e.id}')">報名名單</button><button class="btn btn-view" onclick="openDetail('${e.id}')">查看/報名</button></div>`}<div class="small">${iconPerson()}${count||0} / ${e.participant_limit||21} 人</div></article>`}));$('eventList').innerHTML=html.join('')||'<div class="empty">目前還沒有場次<br>建立第一場羽球活動吧！</div>'}

async function openSignup(id){currentEvent=events.find(e=>e.id===id)||currentEvent;if(!currentEvent)return;if(blockEndedForUser(currentEvent))return;$('signupCard').innerHTML=`<div class="info-card signup-info-card"><div class="info-grid"><div class="info-date"><b>${fmtDate(currentEvent.event_date).m}/${fmtDate(currentEvent.event_date).d}</b><span>週${fmtDate(currentEvent.event_date).w}</span></div><div class="info-title">${iconRacket()}${esc(currentEvent.title)}</div><div class="info-line">${iconTime()}${time(currentEvent.start_time)}－${time(currentEvent.end_time)}</div><div class="info-line">${esc(currentEvent.venue||'未填球館')} ・ ${currentEvent.courts||3} 面</div></div></div><div class="form-card"><div class="field"><label>＋1 報名</label><input id="signupName" value="" placeholder="請輸入姓名"></div><div class="small">可輸入自己的姓名，也可以幫其他人報名。</div></div>`;$('signup').dataset.mode='any';signupViewportBase=signupViewportHeight();formControlFocused=false;show('signup');setKeyboardOpen(false);startSignupKeyboardPoll()}
async function confirmSignup(){const name=$('signupName').value.trim();if(!name)return toast('請先輸入姓名');await registerName(name,'any')}
async function registerName(name,mode){const {data:existing,error:checkError}=await db.from('registrations').select('id,status,name').eq('event_id',currentEvent.id).eq('name',name).limit(1);if(checkError)return toast('報名檢查失敗，請稍後再試');if(existing&&existing.length){toast('你已經報名了！');return}const {count}=await db.from('registrations').select('*',{count:'exact',head:true}).eq('event_id',currentEvent.id).eq('status','confirmed');const status=(count||0)>=(currentEvent.participant_limit||21)?'waitlist':'confirmed';const {data,error}=await db.from('registrations').insert({event_id:currentEvent.id,name,status}).select().single();if(error){if(error.code==='23505'||/duplicate|unique/i.test(error.message||''))return toast('你已經報名了！');return toast('報名失敗，請稍後再試')}setMine(currentEvent.id,data.id);currentReg=data;showSuccess(data,status==='waitlist')}
function showSuccess(r,wait){const d=fmtDate(currentEvent.event_date);$('successDetail').innerHTML=`<div>${iconRacket()}${d.m}/${d.d}　${esc(currentEvent.title)}</div><div>${iconTime()}${time(currentEvent.start_time)}－${time(currentEvent.end_time)}</div><div><span class="success-name">${esc(r.name)}</span> ${wait?'（候補中）':'已加入報名名單'}</div>`;show('success')}
async function showRoster(){if(!currentEvent)return;const {data,error}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).order('registered_at',{ascending:true});if(error)return toast('名單讀取失敗');regs=data||[];const confirmed=regs.filter(r=>r.status==='confirmed'),wait=regs.filter(r=>r.status==='waitlist');$('rosterCard').innerHTML=`<div class="roster-card"><div class="info-title">${iconRacket()}${esc(currentEvent.title)}</div><div class="small" style="margin:4px 0 12px">${iconCalendar()}${fmtDate(currentEvent.event_date).m}/${fmtDate(currentEvent.event_date).d}　${iconTime()}${time(currentEvent.start_time)}－${time(currentEvent.end_time)}</div><div class="count"><strong>${confirmed.length}</strong> / ${currentEvent.participant_limit||21} 人</div>${confirmed.map((r,i)=>personRow(r,i+1,'已報名')).join('')}${wait.length?`<div class="small" style="margin-top:14px">候補</div>${wait.map((r,i)=>personRow(r,i+1,'候補')).join('')}`:''}</div>`;show('roster')}
function personRow(r,num,status){return `<div class="person"><span class="person-name">${num}. ${esc(r.name)}</span><span class="person-actions"><button class="trash-btn" title="取消報名" aria-label="取消${esc(r.name)}的報名" onclick="cancelRegistration('${r.id}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V4h6v2M18.5 6l-1 14h-11l-1-14M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="badge ${status==='已報名'?'badge-confirmed':''}">${status}</span></span></div>`}
function askCancel(name){return new Promise(resolve=>{const modal=$('cancelModal'),title=$('cancelModalTitle'),yes=$('cancelConfirmBtn'),no=$('cancelBackBtn');title.textContent=`確定要取消「${name}」的報名嗎？`;modal.classList.add('show');modal.setAttribute('aria-hidden','false');const close=value=>{modal.classList.remove('show');modal.setAttribute('aria-hidden','true');yes.onclick=null;no.onclick=null;resolve(value)};yes.onclick=()=>close(true);no.onclick=()=>close(false)} )}
async function cancelRegistration(id){const r=regs.find(x=>x.id===id);if(!r)return;if(!(await askCancel(r.name)))return;const {error}=await db.from('registrations').delete().eq('id',id).eq('event_id',currentEvent.id);if(error)return toast('取消失敗：'+(error.message||'請稍後再試'));if(localStorage.getItem('badminton_reg_'+currentEvent.id)===id)localStorage.removeItem('badminton_reg_'+currentEvent.id);if(r.status==='confirmed'){const {data:wait}=await db.from('registrations').select('*').eq('event_id',currentEvent.id).eq('status','waitlist').order('registered_at',{ascending:true}).limit(1);if(wait&&wait[0])await db.from('registrations').update({status:'confirmed'}).eq('id',wait[0].id)}toast('已取消報名');await showRoster()}
function getMine(id){const name=localStorage.getItem('badminton_name')||'';return regs.find(r=>r.event_id===id&&r.name===name)||null}function setMine(id,rid){localStorage.setItem('badminton_reg_'+id,rid)}
async function cancelMyRegistration(){if(!currentEvent)return;await showRoster()}
function requirePassword(action){return new Promise(resolve=>{const modal=$('passwordModal'),title=$('passwordModalTitle'),input=$('passwordInput'),yes=$('passwordConfirmBtn'),no=$('passwordCancelBtn');title.textContent=action+'請輸入密碼';input.value='';modal.classList.add('show');modal.setAttribute('aria-hidden','false');const close=value=>{modal.classList.remove('show');modal.setAttribute('aria-hidden','true');yes.onclick=null;no.onclick=null;input.onkeydown=null;resolve(value)};yes.onclick=()=>{const p=input.value;if(p!=='2418'){toast('密碼錯誤');input.value='';input.focus();return}close(true)};no.onclick=()=>close(false);input.onkeydown=e=>{if(e.key==='Enter')yes.click()};setTimeout(()=>{input.focus();input.select()},60)})}
document.addEventListener('input',e=>{if(e.target.id==='passwordInput')e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)});
let formControlFocused=false;
let keyboardSyncTimer=null;
let signupViewportBase=null;
let signupKeyboardPoll=null;
function setKeyboardOpen(open){const signup=$('signup');if(signup)signup.classList.toggle('keyboard-open',!!open)}
function signupViewportHeight(){
 const vv=window.visualViewport?.height||0;
 const wh=window.innerHeight||0;
 return Math.max(vv,wh);
}
function updateSignupKeyboardState(){
 const signup=$('signup');
 if(!signup||!signup.classList.contains('active'))return;
 const h=signupViewportHeight();
 if(signupViewportBase==null)signupViewportBase=h;
 const active=document.activeElement;
 const focused=!!(active&&active.matches&&active.matches('input,textarea,select'));
 if(formControlFocused && signupViewportBase-h>40){
   setKeyboardOpen(true);
   return;
 }
 // When the keyboard is dismissed, some mobile browsers keep focus on the input
 // and do not fire blur/focusout. Use the restored viewport height as the signal.
 if(signupViewportBase-h<=40){
   setKeyboardOpen(false);
   return;
 }
 setKeyboardOpen(focused&&formControlFocused);
}
function scheduleSignupKeyboardSync(delay=0){clearTimeout(keyboardSyncTimer);keyboardSyncTimer=setTimeout(updateSignupKeyboardState,delay)}
function startSignupKeyboardPoll(){
 clearInterval(signupKeyboardPoll);
 signupKeyboardPoll=setInterval(()=>{
   const signup=$('signup');
   if(!signup||!signup.classList.contains('active'))return;
   updateSignupKeyboardState();
 },100);
}
function stopSignupKeyboardPoll(){clearInterval(signupKeyboardPoll);signupKeyboardPoll=null}
document.addEventListener('focusin',e=>{
 if(e.target.id==='recordsName'&&$('records')?.classList.contains('active')){
   $('records').classList.add('records-keyboard-open');
 }
 if(e.target.matches('input,textarea,select')&&$('signup')?.classList.contains('active')){
   formControlFocused=true;
   setKeyboardOpen(true);
   scheduleSignupKeyboardSync(100);
 }
});
document.addEventListener('focusout',e=>{
 if(e.target.id==='recordsName'&&$('records')?.classList.contains('active')){
   $('records').classList.remove('records-keyboard-open');
 }
 if(e.target.matches('input,textarea,select')&&$('signup')?.classList.contains('active')){
   formControlFocused=false;
   setKeyboardOpen(false);
   scheduleSignupKeyboardSync(0);
 }
});
if(window.visualViewport){
 window.visualViewport.addEventListener('resize',()=>{
   if(!$('signup')?.classList.contains('active'))return;
   scheduleSignupKeyboardSync(0);
 });
 window.visualViewport.addEventListener('scroll',updateSignupKeyboardState);
}
window.addEventListener('resize',()=>{if($('signup')?.classList.contains('active'))scheduleSignupKeyboardSync(0)});

async function createEvent(){
 const btn=$('createSubmit');
 if(btn.disabled)return;
 const title=$('fTitle').value.trim();
 const date=$('fDate').value;
 const start=$('fStart').value;
 const end=$('fEnd').value;
 if(!title||!date||!start||!end){return toast('請填寫活動名稱、日期與時間')}
 if(end<=start){return toast('結束時間要晚於開始時間')}
 const payload={title,event_date:date,start_time:start,end_time:end,venue:$('fVenue').value.trim(),courts:Math.max(1,Number($('fCourts').value)||3),participant_limit:Math.max(1,Number($('fLimit').value)||21),notes:$('fNotes').value.trim(),created_at:new Date().toISOString()};
 btn.disabled=true;btn.textContent='建立中…';
 try{
   const {error}=await db.from('events').insert(payload);
   if(error){console.error('createEvent:',error);toast('建立失敗：'+(error.message||'請檢查 Supabase 權限'));return}
   const {data:allEvents,error:orderError}=await db.from('events').select('id,created_at').order('created_at',{ascending:false});
   if(orderError){console.error('enforce event limit:',orderError);toast('場次已建立，但排序資料讀取失敗');return}
   const oldIds=(allEvents||[]).slice(4).map(e=>e.id);
   if(oldIds.length){
     const {error:deleteOldError}=await db.from('events').delete().in('id',oldIds);
     if(deleteOldError){console.error('delete oldest events:',deleteOldError);toast('場次已建立，但舊場次刪除失敗');return}
   }
   $('fTitle').value='';$('fDate').value='';$('fStart').value='';$('fEnd').value='';$('fVenue').value='';$('fCourts').value='3';$('fLimit').value='21';$('fNotes').value='';
   toast('場次已建立');
   await loadEvents();
   show('list');
 }catch(err){
   console.error('createEvent exception:',err);
   toast('建立失敗：'+(err?.message||'網路連線或 Supabase 發生問題'));
 }finally{
   btn.disabled=false;btn.textContent='建立場次';
 }
}
function askDeleteEvent(name){return new Promise(resolve=>{const modal=$('deleteModal'),title=$('deleteModalTitle'),yes=$('deleteConfirmBtn'),no=$('deleteBackBtn');title.textContent=`確定要刪除「${name}」這個場次嗎？`;modal.classList.add('show');modal.setAttribute('aria-hidden','false');const close=value=>{modal.classList.remove('show');modal.setAttribute('aria-hidden','true');yes.onclick=null;no.onclick=null;resolve(value)};yes.onclick=()=>close(true);no.onclick=()=>close(false)})}
async function deleteEvent(){if(!currentEvent)return;if(!(await askDeleteEvent(currentEvent.title)))return;const {error}=await db.from('events').delete().eq('id',currentEvent.id);if(error)return toast('刪除失敗');currentEvent=null;show('list')}
async function editEvent(){if(!currentEvent)return;const e=currentEvent;const card=$('detailCard');card.innerHTML=`<div class="form-card"><div class="field"><label>活動名稱</label><input id="eTitle" value="${esc(e.title)}"></div><div class="two"><div class="field"><label>日期</label><input id="eDate" type="date" value="${e.event_date}"></div><div class="field"><label>開始</label><input id="eStart" type="time" value="${time(e.start_time)}"></div></div><div class="field"><label>結束</label><input id="eEnd" type="time" value="${time(e.end_time)}"></div><div class="field"><label>球館</label><input id="eVenue" value="${esc(e.venue||'')}"></div><div class="two"><div class="field"><label>場地數</label><input id="eCourts" type="number" value="${e.courts||3}"></div><div class="field"><label>人數上限</label><input id="eLimit" type="number" value="${e.participant_limit||21}"></div></div><div class="field"><label>備註</label><textarea id="eNotes" rows="3">${esc(e.notes||'')}</textarea></div><button class="btn btn-green btn-full" onclick="saveEvent()">儲存修改</button></div>`}
async function saveEvent(){const {data,error}=await db.from('events').update({title:$('eTitle').value.trim(),event_date:$('eDate').value,start_time:$('eStart').value,end_time:$('eEnd').value,venue:$('eVenue').value.trim(),courts:+$('eCourts').value||3,participant_limit:+$('eLimit').value||21,notes:$('eNotes').value.trim()}).eq('id',currentEvent.id).select().single();if(error)return toast('修改失敗');currentEvent=data;toast('已儲存');renderDetail()}
async function loadRecords(){const input=$('recordsName');const name=input?input.value.trim():'';if(!name){$('recordsList').innerHTML='<div class="empty record-empty">請先輸入姓名</div>';return}const {data,error}=await db.from('registrations').select('*,events(*)').eq('name',name).order('registered_at',{ascending:false});if(error){$('recordsList').innerHTML='<div class="empty record-empty">紀錄讀取失敗，請稍後再試</div>';return}const rows=data||[];$('recordsList').innerHTML=rows.map(r=>`<div class="record"><div class="rdate">${iconCalendar()}${r.events?.event_date||''}</div><div class="rtitle">${iconRacket()}${esc(r.events?.title||'')}</div><div class="rtime">${iconTime()}${time(r.events?.start_time)}－${time(r.events?.end_time)}　<span class="rstatus">${r.status==='waitlist'?'候補':'已報名'}</span></div></div>`).join('')||`<div class="empty record-empty">找不到「${esc(name)}」的報名紀錄<br>請確認姓名是否輸入正確</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('createSubmit').addEventListener('click',createEvent);
loadEvents();setInterval(()=>{if(document.querySelector('#list.active'))loadEvents()},5000);
</script></body></html>
